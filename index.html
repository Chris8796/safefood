<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basketball Life Prototype v0.7</title>
<style>
:root{--bg:#0b0f14;--card:#151b24;--line:#2a3442;--txt:#eef3f8;--muted:#96a3b4;--accent:#f59e0b;--blue:#60a5fa;--green:#34d399;--violet:#c084fc;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#090c11,#111826);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:rgba(21,27,36,.97);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:390px 1fr;gap:14px}@media(max-width:860px){.grid{grid-template-columns:1fr}}h1{font-size:27px;margin:0 0 4px}h2{font-size:17px;margin:0 0 11px}.sub,.small{color:var(--muted);font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0e141d;color:var(--txt);font-size:14px}button{font-weight:800;cursor:pointer}.primary{background:var(--accent);border:0;color:#1b1305}.secondary{background:#202938}.ghost{background:#111824}.hidden{display:none!important}.note{background:#111824;border-left:3px solid var(--accent);padding:10px;border-radius:8px;font-size:12px;color:#cbd5e1;margin-bottom:10px}.players{display:grid;gap:10px}.player{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:12px}.head{display:flex;justify-content:space-between;gap:12px}.name{font-weight:900}.score{font-weight:900;color:var(--accent)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#202938}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}.stat{background:#0f151e;border:1px solid var(--line);border-radius:11px;padding:9px}.stat b{display:block;font-size:19px}.bar{height:6px;background:#090d13;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}.careerTop{display:flex;justify-content:space-between;gap:12px}.ovr{font-size:36px;font-weight:900}.stage{font-size:23px;font-weight:900}.story{font-size:16px;line-height:1.8;color:#e5e7eb}.storyTitle{font-size:20px;font-weight:900;margin-bottom:8px}.choiceGrid{display:grid;grid-template-columns:1fr;gap:9px}.choice{padding:14px;text-align:left;background:#141d2a}.choice strong{display:block;font-size:15px}.choice span{display:block;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.resultBox{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:13px;line-height:1.7}.log{max-height:330px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:12px;padding:11px}.log p{margin:0 0 10px;line-height:1.55}.blue{color:var(--blue);font-weight:800}.violet{color:var(--violet);font-weight:800}.green{color:var(--green);font-weight:800}.red{color:var(--red);font-weight:800}.dice{display:inline-block;background:#202938;padding:1px 6px;border-radius:6px;font-weight:800}hr{border:0;border-top:1px solid var(--line);margin:13px 0}
</style>
</head>
<body><div class="wrap">
<div><h1>🏀 Basketball Life — Prototype v0.7</h1><div class="sub">章節式 HBL 生涯：情境 → 選擇 → 骰子 → 事件 → 賽季結果</div></div>

<div id="setup" class="grid" style="margin-top:14px">
<div>
<div class="card"><h2>① 球員基本資料</h2><div class="note">固定從 HBL 高一開始。這區只決定球員本身。</div>
<div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div>
<div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div>
<div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div>
<div class="row"><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div><div><label>打法傾向</label><select id="style"><option value="balanced">自由 / 均衡</option><option value="handler">持球核心</option><option value="shooter">投射型</option><option value="defender">防守型</option><option value="big">長人核心</option></select></div></div>
<button class="primary" onclick="generatePlayer()">生成球員</button></div>
<div class="card"><h2>② 事件種子碼</h2><div class="note">Seed 只控制本輪事件、事件順序與分支結果。</div><input id="seed" value="THREADS-2026"></div>
</div>
<div><div class="card"><h2>③ 生成過的球員</h2><div id="players" class="players"><div class="small">尚未生成球員。</div></div></div></div>
</div>

<div id="career" class="hidden" style="margin-top:14px">
<div class="card"><div class="careerTop"><div><div id="stage" class="stage">HBL 高一</div><h2 id="careerTitle"></h2><div id="chips" class="chips"></div></div><div style="text-align:right"><div class="small">OVR</div><div id="ovr" class="ovr">--</div></div></div><hr><div id="stats" class="stats"></div></div>

<div id="storyCard" class="card"><div id="storyTitle" class="storyTitle"></div><div id="storyText" class="story"></div></div>
<div id="choiceCard" class="card"><h2 id="choiceHeading">你要怎麼做？</h2><div id="choices" class="choiceGrid"></div></div>
<div id="resultCard" class="card hidden"><h2>結果</h2><div id="actionResult" class="resultBox"></div><button id="nextStepBtn" class="primary" style="margin-top:10px" onclick="nextStep()">繼續</button></div>
<div id="seasonCard" class="card hidden"><h2>年度總結</h2><div id="seasonSummary" class="resultBox"></div><button id="continueBtn" class="primary" style="margin-top:10px" onclick="continueYear()">進入下一學年</button></div>
<div class="card"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:10px" onclick="backSetup()">← 回球員建立頁</button></div>
</div>

<script>
var roster=[],current=null,playerId=1,eventRand=Math.random;
var names={finish:'終結',mid:'中距離',three:'三分',ft:'罰球',handle:'控球',pass:'傳球',defense:'外線防守',interior:'內線防守',rebound:'籃板',speed:'速度',strength:'力量',iq:'籃球IQ'};
function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}function pick(a){return a[Math.floor(eventRand()*a.length)]}
function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d100(){return Math.floor(eventRand()*100)+1}
function ovr(p){var s=p.skills;return Math.round(avg([s.finish,s.mid,s.three,s.handle,s.pass,s.defense,s.interior,s.rebound,s.speed,s.strength,s.iq]))}function score(p){return Math.round(ovr(p)*.8+(p.hblTitles||0)*18+(p.hblMvp||0)*16+(p.hblAwards||0)*5)}
function type(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=78&&s.three>=78&&s.interior>=78)return'獨角獸';if(h>=205&&s.pass>=82&&s.iq>=82&&s.rebound>=74)return'全能組織長人';if(h>=198&&s.handle>=82&&s.pass>=80)return'控球前鋒';if(s.three>=82&&s.defense>=80)return'3&D';if(s.pass>=86&&s.handle>=84)return'進攻發動機';if(s.interior>=86&&s.rebound>=84)return'護框中樞';return'多功能球員'}
function generatePlayer(){var p={id:playerId++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,style:E('style').value,grade:1,age:16,hblTitles:0,hblMvp:0,hblAwards:0,skills:{}};var base=ri(50,67),k;for(k in names)p.skills[k]=clamp(base+ri(-9,11),32,86);if(p.style==='handler'){p.skills.handle+=9;p.skills.pass+=8;p.skills.iq+=5}if(p.style==='shooter'){p.skills.three+=11;p.skills.mid+=7;p.skills.ft+=5}if(p.style==='defender'){p.skills.defense+=10;p.skills.interior+=6;p.skills.rebound+=4}if(p.style==='big'){p.skills.interior+=11;p.skills.rebound+=9;p.skills.pass+=4}p.skills.interior+=Math.round((p.height-195)/3);p.skills.rebound+=Math.round((p.wingspan-p.height)/3);p.skills.strength+=Math.round((p.weight-90)/5);if(p.height>208)p.skills.handle-=Math.round((p.height-208)/4);for(k in p.skills)p.skills[k]=clamp(p.skills[k],25,94);roster.push(p);renderRoster()}
function renderRoster(){if(!roster.length){E('players').innerHTML='<div class="small">尚未生成球員。</div>';return}var h='';for(var i=0;i<roster.length;i++){var p=roster[i];h+='<div class="player"><div class="head"><div><div class="name">'+p.name+'</div><div class="small">'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜臂展 '+p.wingspan+'cm｜'+type(p)+'</div></div><div class="score">'+score(p)+'</div></div><div class="small" style="margin:7px 0">OVR '+ovr(p)+'｜HBL 高一｜成就分數 '+score(p)+'</div><button class="primary" onclick="start('+p.id+')">開始人生</button></div>'}E('players').innerHTML=h}
function start(id){var b=null;for(var i=0;i<roster.length;i++)if(roster[i].id===id)b=roster[i];if(!b)return;current=JSON.parse(JSON.stringify(b));current.seed=E('seed').value.trim()||'DEFAULT';current.used={};current.log=[];current.phase='intro';current.focus=null;eventRand=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');addLog('🏁 <b>'+current.name+'</b> 從 HBL 高一開始人生。');renderCareer();showIntro()}
function addLog(x){current.log.unshift(x);E('log').innerHTML=current.log.map(function(a){return'<p>'+a+'</p>'}).join('')}
function yearName(){return current.grade===1?'高一':current.grade===2?'高二':'高三'}
function showIntro(){E('seasonCard').classList.add('hidden');E('resultCard').classList.add('hidden');E('storyCard').classList.remove('hidden');E('choiceCard').classList.remove('hidden');var y=yearName();var intro={1:{t:'第一天報到',x:'你第一次穿上高中球隊的練習服。學長的對抗強度比國中完全不同，教練只說了一句：「先證明你值得上場。」這一年，你想先建立哪一種武器？'},2:{t:'角色開始改變',x:'經過一年的磨練，教練已經知道你的優缺點。高二通常是搶下輪替甚至先發位置的關鍵一年，你必須決定自己要往哪個方向突破。'},3:{t:'最後一次 HBL',x:'這是你的高中最後一年。球探、升學與隊友期待同時壓在身上。你知道這一季的表現，可能直接改變下一階段的人生。'}}[current.grade];E('storyTitle').textContent=intro.t;E('storyText').textContent=intro.x;showFocusChoices()}
function showFocusChoices(){E('choiceHeading').textContent='本年度你要把重心放在哪裡？';var arr=[['handle','🪄 強化持球','增加控球、傳球與進攻發動能力'],['shoot','🎯 強化投射','增加三分、中距離與罰球穩定度'],['physical','💪 強化身體','增加速度、力量與終結能力'],['defense','🛡️ 強化防守','增加外線防守、護框與籃板'],['balanced','🧠 全面發展','不押單一技能，成長較平均']];E('choices').innerHTML=arr.map(function(a){return '<button class="choice" onclick="chooseFocus(\''+a[0]+'\')"><strong>'+a[1]+'</strong><span>'+a[2]+'</span></button>'}).join('')}
function chooseFocus(f){current.focus=f;var pools={handle:['handle','pass','iq'],shoot:['three','mid','ft'],physical:['speed','strength','finish'],defense:['defense','interior','rebound'],balanced:Object.keys(names)};var pool=pools[f],lines=[];for(var i=0;i<3;i++){var k=pick(pool),before=current.skills[k],chance=clamp(82-(before-55)*.75+(current.grade===1?5:0),18,92),r=d100(),gain=0;if(r<=5)gain=3;else if(r<=chance)gain=r<=chance*.35?2:1;current.skills[k]=clamp(before+gain,25,99);lines.push(names[k]+'：<span class="dice">🎲 '+r+'</span> '+(gain?'<span class="green">+'+gain+'</span>':'沒有提升'))}E('storyCard').classList.add('hidden');E('choiceCard').classList.add('hidden');E('resultCard').classList.remove('hidden');E('actionResult').innerHTML='<b>休賽季訓練結果</b><br>'+lines.join('<br>');E('nextStepBtn').textContent='進入本季事件';current.phase='event';renderCareer()}
var events=[
{id:'role',title:'教練突然交給你新的任務',text:'球隊主控在練習中受傷，教練看了你一眼：「這幾週你來控球。」你原本並不是主要控球者。',choices:[['accept','接受挑戰','可能增加控球與傳球，但失敗也可能影響效率'],['safe','維持原本角色','較安全，但可能錯過位置轉型機會']]},
{id:'bench',title:'你被移出先發',text:'連續幾場表現不穩後，教練把你換到替補。媒體沒有太大反應，但你自己很清楚：如果一直這樣，球隊地位會往下掉。',choices:[['fight','加練把位置搶回來','成長機會較高，但疲勞風險增加'],['adapt','接受第六人角色','降低壓力，可能發展不同打法']]},
{id:'viral',title:'一段影片突然爆紅',text:'有人把你在校內活動的片段上傳社群，結果莫名爆紅。接下來幾天，同學和陌生帳號都在討論你，但內容幾乎跟籃球無關。',choices:[['ignore','完全不理會','保持專注，心理檢定較穩定'],['use','順勢經營曝光','可能增加聲量，也可能分散注意力']]},
{id:'family',title:'家裡突然有狀況',text:'家中需要你在放學後投入更多時間處理事情。你沒有辦法像平常一樣留隊加練。',choices:[['family','先把家裡顧好','體力與訓練量下降，但壓力較小'],['balance','想辦法兩邊兼顧','成功可維持成長，失敗則更疲勞']]},
{id:'conflict',title:'隊內氣氛爆炸',text:'一次激烈對抗後，你和隊友因為球權與防守責任吵了起來。學長和教練都在旁邊看。',choices:[['calm','主動把事情講開','考驗成熟度，成功可提升球隊信任'],['hard','堅持自己沒有錯','可能建立強勢形象，也可能讓關係惡化']]},
{id:'injury',title:'腳踝落地時扭了一下',text:'一次搶籃板落地，你踩到別人的腳。疼痛沒有到完全不能走，但距離重要比賽只剩幾週。',choices:[['rest','完整休養','降低傷勢惡化，但可能錯過比賽'],['play','帶傷繼續打','可能撐過去，也可能讓傷勢加重']]}
];
function nextStep(){if(current.phase!=='event')return;var available=events.filter(function(e){return !current.used[e.id]});var e=available[Math.floor(eventRand()*available.length)];current.activeEvent=e;current.used[e.id]=true;E('resultCard').classList.add('hidden');E('storyCard').classList.remove('hidden');E('choiceCard').classList.remove('hidden');E('storyTitle').textContent=e.title;E('storyText').textContent=e.text;E('choiceHeading').textContent='你的選擇';E('choices').innerHTML=e.choices.map(function(c){return '<button class="choice" onclick="resolveEvent(\''+c[0]+'\')"><strong>'+c[1]+'</strong><span>'+c[2]+'</span></button>'}).join('')}
function resolveEvent(c){var e=current.activeEvent,r=d100(),out='';if(e.id==='role'){if(c==='accept'){if(r<=62){current.skills.handle+=2;current.skills.pass+=2;if(current.pos==='SF'||current.pos==='PF')current.pos='PG / '+current.pos;out='你適應得比預期更快。控球 +2、傳球 +2，位置開始出現轉型。'}else out='你暫時無法掌握新的節奏，教練最後把你放回原本角色。'}else{current.skills.iq+=1;out='你選擇把原本角色做好。籃球 IQ +1。'}}
if(e.id==='bench'){if(c==='fight'){if(r<=58){current.skills.finish+=1;current.skills.three+=1;out='加練收到效果，你重新回到主要輪替。終結 +1、三分 +1。'}else{current.skills.speed-=1;out='疲勞開始累積，速度 -1。'}}else{current.skills.iq+=2;out='你找到第六人的節奏，籃球 IQ +2。'}}
if(e.id==='viral'){if(c==='ignore'){current.skills.iq+=1;out='你幾乎不看社群，專注度反而提升。籃球 IQ +1。'}else{if(r<=45){current.hblAwards+=1;out='曝光帶來正面關注，人氣提升。'}else{current.skills.ft-=1;out='注意力被打亂，罰球 -1。'}}}
if(e.id==='family'){if(c==='family'){current.skills.speed-=1;out='訓練量下降，速度 -1，但事情逐漸穩定。'}else{if(r<=50){current.skills.iq+=1;out='你成功兼顧兩邊，籃球 IQ +1。'}else{current.skills.strength-=1;current.skills.speed-=1;out='長期疲勞累積，力量 -1、速度 -1。'}}}
if(e.id==='conflict'){if(c==='calm'){if(r<=65){current.skills.iq+=1;out='你主動溝通，事情沒有繼續擴大。籃球 IQ +1。'}else out='溝通沒有立刻奏效，但至少沒有進一步惡化。'}else{if(r<=35){current.skills.defense+=1;out='你的強硬態度意外讓球隊在防守端更有火花。外線防守 +1。'}else out='隊內關係變得緊張，本季角色受到一些影響。'}}
if(e.id==='injury'){if(c==='rest'){out='你選擇休息，沒有留下明顯後遺症。'}else{if(r<=70){out='你撐過去了，傷勢沒有惡化。'}else{current.skills.speed-=2;out='傷勢惡化，速度 -2。'}}}
for(var k in current.skills)current.skills[k]=clamp(current.skills[k],25,99);E('storyCard').classList.add('hidden');E('choiceCard').classList.add('hidden');E('resultCard').classList.remove('hidden');E('actionResult').innerHTML='<b>'+e.title+'</b><br><span class="dice">🎲 '+r+'</span><br>'+out;E('nextStepBtn').textContent='查看本季結果';current.phase='season';current.activeEvent=null;renderCareer();addLog('<span class="violet">'+e.title+'</span>｜'+out);E('nextStepBtn').onclick=finishSeason}
function finishSeason(){var s=current.skills,quality=ovr(current)+(current.grade-1)*2;var ppg=Math.max(2,((s.finish+s.mid+s.three)/3-38)*.42+(eventRand()*4-2));var rpg=Math.max(1,(s.rebound-35)*.16+(eventRand()*2));var apg=Math.max(.5,(s.pass+s.handle-75)*.08+(eventRand()*1.5));var role=quality>=82?'球隊核心':quality>=73?'先發主力':quality>=64?'主要輪替':'替補';var titleRoll=d100(),awardRoll=d100(),extra='';if(titleRoll<=clamp(5+(quality-65)*.55,3,25)){current.hblTitles++;extra+='🏆 HBL 冠軍<br>'}if(awardRoll<=clamp((quality-72)*.65,0,18)){current.hblAwards++;extra+='⭐ 年度個人獎項<br>'}E('resultCard').classList.add('hidden');E('seasonCard').classList.remove('hidden');E('seasonSummary').innerHTML='<b>'+yearName()+'賽季結束</b><br>角色：'+role+'<br>'+ppg.toFixed(1)+' PTS / '+rpg.toFixed(1)+' REB / '+apg.toFixed(1)+' AST<br>'+extra+'OVR：'+ovr(current)+'｜成就分數：'+score(current);addLog('<span class="blue">'+yearName()+'結束</span>｜'+ppg.toFixed(1)+' PTS / '+rpg.toFixed(1)+' REB / '+apg.toFixed(1)+' AST｜'+role);E('nextStepBtn').onclick=nextStep;renderCareer()}
function continueYear(){if(current.grade>=3){E('continueBtn').classList.add('hidden');E('seasonSummary').innerHTML+='<br><br><b class="green">HBL 三年生涯完成</b><br>接下來才會進入升學 / 海外 / 職業選擇。';addLog('🎓 <b>HBL 生涯完成。</b>');return}current.grade++;current.age++;current.phase='intro';E('continueBtn').textContent=current.grade===3?'進入高三':'進入下一學年';renderCareer();showIntro()}
function renderCareer(){E('stage').textContent='HBL '+yearName();E('careerTitle').textContent=current.name+'｜'+current.age+'歲';E('ovr').textContent=ovr(current);E('chips').innerHTML=[current.pos,current.height+'cm',current.weight+'kg','臂展 '+current.wingspan+'cm',type(current),'Seed '+current.seed].map(function(x){return'<span class="chip">'+x+'</span>'}).join('');var h='';for(var k in current.skills)h+='<div class="stat"><span class="small">'+names[k]+'</span><b>'+current.skills[k]+'</b><div class="bar"><div class="fill" style="width:'+current.skills[k]+'%"></div></div></div>';E('stats').innerHTML=h}
function backSetup(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster()}
