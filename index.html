<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.1</title><style>
:root{--bg:#090d12;--panel:#141b25;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.topbar{margin-bottom:16px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:rgba(20,27,37,.98);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 32px rgba(0,0,0,.18)}h2{margin:0 0 12px;font-size:18px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#1c1305;border:0}.ghost{background:#111923}.hidden{display:none!important}.note{font-size:13px;line-height:1.65;color:#c9d2dd;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}.players{display:grid;gap:10px}.player{background:#0f151d;border:1px solid var(--line);border-radius:14px;padding:13px}.playerhead{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:900}.score{font-size:24px;font-weight:900;color:var(--orange)}
.career{display:grid;grid-template-columns:245px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:24px;font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:#202a38;border:1px solid var(--line)}.ovr{font-size:42px;font-weight:950;margin:6px 0}.pool{font-size:32px;font-weight:950;color:var(--orange)}.progress{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#111923;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a;border-color:#6f4b0d}.step.done{color:var(--green)}
.storyCard{min-height:350px}.eyebrow{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:.05em;margin-bottom:7px}.storyTitle{font-size:27px;font-weight:950;margin-bottom:10px}.story{font-size:16px;line-height:1.9;color:#e7edf4;white-space:pre-line}.scoreboard{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.board{background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:10px 13px}.board b{font-size:21px}.clock{color:var(--orange)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}.choice{text-align:left;background:#121b27;padding:14px;border:1px solid #314158}.choice strong{display:block;font-size:15px}.choice span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.55}.test{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:7px;background:#1c2634;color:#c9dcf5}.result{margin-top:15px;background:#0f151e;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}
.diceWrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0}.d20{width:96px;height:96px;position:relative;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:drop .5s ease-out}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;text-shadow:0 2px 5px #000}@keyframes drop{0%{transform:translateY(-28px) rotate(-18deg) scale(.82);opacity:0}75%{transform:translateY(3px) rotate(4deg) scale(1.04)}100%{transform:none;opacity:1}}
.attrCard{margin-top:16px}.attrTabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:10px}.tab{width:auto;white-space:nowrap;background:#111923;padding:8px 12px}.tab.active{background:#26364a;border-color:#55759e}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:10px}.attrTop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.attrName{font-size:12px;color:#ccd6e2}.attrVal{font-size:22px;font-weight:950}.cost{font-size:11px;color:var(--muted);margin-top:2px}.plus{margin-top:7px;padding:7px;background:#243247}.plus:disabled{opacity:.35}.bar{height:5px;background:#090e14;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.log{max-height:230px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:12px;padding:10px}.log p{margin:0 0 8px;line-height:1.5}
@media(max-width:950px){.career{grid-template-columns:1fr}.side{position:static}.setup{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.choices{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}.attr{padding:9px}.attrVal{font-size:20px}}
</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.1</span></h1><div class="small">D20 生涯測試｜每學年 5 個故事事件｜能力網格</div></div>
<div id="setup" class="setup"><div><div class="card"><h2>① 球員基本資料</h2><div class="note">固定從 HBL 高一開始。球員類型由能力組合自然形成。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div class="row"><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div></div><button class="primary" onclick="generatePlayer()">生成球員</button></div><div class="card" style="margin-top:16px"><h2>② 事件 Seed</h2><div class="note">Seed 只控制事件順序與 D20 結果，不影響球員生成。</div><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>③ 生成過的球員</h2><div id="players" class="players"><div class="small">尚未生成球員。</div></div></div></div>
<div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage">HBL 高一</div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:13px">OVR</div><div id="ovr" class="ovr">--</div><div class="small">剩餘訓練點</div><div id="pool" class="pool">0</div></div></aside><main><div id="progress" class="progress"></div><div class="card storyCard"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card attrCard"><h2>能力值</h2><div class="small" style="margin-bottom:9px">「近框手感」代表拋投、擦板、對抗後小勾射等非標準近框處理；上籃與灌籃則分開計算。</div><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card" style="margin-top:16px"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="location.reload()">← 回首頁</button></div></main></div></div>
<script>
var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';
var groups={'進攻':['touch','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};
var names={touch:'近框手感',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};
function phases(){return ['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']}
function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function cost(v){if(v<60)return 1;if(v<70)return 2;if(v<75)return 3;if(v<80)return 4;if(v<85)return 5;if(v<90)return 7;if(v<95)return 10;if(v<98)return 15;if(v<99)return 20;return 999}function ovr(p){return Math.round(avg(Object.values(p.skills)))}
function archetype(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=80&&s.three>=80&&s.block>=85)return'獨角獸';if(h>=205&&s.pass>=85&&s.vision>=86&&s.dreb>=80)return'全能組織長人';if(h>=198&&s.handle>=85&&s.pass>=82)return'控球前鋒';if(s.three>=85&&s.perdef>=84)return'3&D';if(s.pass>=88&&s.vision>=88&&s.handle>=86)return'進攻發動機';return'尚未定型'}
function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(44,61);Object.keys(names).forEach(k=>p.skills[k]=clamp(base+ri(-9,11),28,76));p.skills.touch+=Math.round((p.height-195)/6);p.skills.dunk+=Math.round((p.height-195)/3);p.skills.intdef+=Math.round((p.height-195)/3);p.skills.block+=Math.round((p.wingspan-p.height)/2.5);p.skills.dreb+=Math.round((p.wingspan-p.height)/3);p.skills.strength+=Math.round((p.weight-88)/5);if(p.height>208){p.skills.handle-=Math.round((p.height-208)/4);p.skills.accel-=Math.round((p.height-208)/5)}Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],25,86));roster.push(p);renderRoster()}
function renderRoster(){E('players').innerHTML=roster.map(p=>'<div class="player"><div class="playerhead"><div><div class="name">'+p.name+'</div><div class="small">'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜'+archetype(p)+'</div></div><div class="score">'+ovr(p)+'</div></div><button class="primary" style="margin-top:9px" onclick="startCareer('+p.id+')">開始人生</button></div>').join('')}
function startCareer(id){var p=roster.find(x=>x.id===id);current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.phase=0;current.pool=0;current.log=[];current.eventOrder={};rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');addLog('🏁 '+current.name+' 開始 HBL 高一生涯。');prepareYear();renderAll();renderPhase()}
function prepareYear(){var arr=[0,1,2,3,4];for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}current.eventOrder[current.grade]=arr}
function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function year(){return current.grade===1?'高一':current.grade===2?'高二':'高三'}
function renderAll(){E('stage').textContent='HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>';renderProgress();renderTabs();renderAttrs()}
function renderProgress(){E('progress').innerHTML=phases().map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}
function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}
function renderAttrs(){var can=current&&current.phase===2;E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return '<div class="attr"><div class="attrTop"><span class="attrName">'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}
function d20html(n){return '<div class="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 92,28 82,78 50,97 18,78 8,28" fill="#b86b08" stroke="#ffd18a" stroke-width="2"/><polygon points="50,3 50,50 8,28" fill="#7f4705"/><polygon points="50,3 92,28 50,50" fill="#d18411"/><polygon points="8,28 50,50 18,78" fill="#a35d08"/><polygon points="92,28 82,78 50,50" fill="#915006"/><polygon points="18,78 50,50 50,97" fill="#c3730b"/><polygon points="82,78 50,97 50,50" fill="#6f3d04"/></svg><div class="num">'+n+'</div></div>'}
function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('result').className='result hidden';E('continueBtn').classList.add('hidden');E('continueBtn').textContent='繼續'}
var intros={1:{title:'第一次穿上高中球衣',text:'球衣背後印著你的名字，但更衣室裡沒有人在意你國中時拿過多少分。\n\n第一次隊內對抗，學長直接把你撞出底線。教練沒有吹哨，只看著你怎麼爬起來。\n\n這一年，你首先要爭的不是明星位置，而是「讓教練願意把你放上場」。'},2:{title:'你已經不是菜鳥了',text:'一年過去，更衣室裡不再有人叫你「新人」。但這也代表所有藉口都消失了。\n\n教練在季前會議把先發名單留了一個空格，抬頭看向你和另一名同位置球員。\n\n高二，是從輪替球員變成真正主力最重要的一年。'},3:{title:'最後一次穿上這件球衣',text:'高三開學，學弟第一次叫你「學長」。球館牆上貼著新的 HBL 賽程，而你很清楚：這一次打完，就沒有下一個高中球季了。\n\n升學、球探、隊友期待，全都會在今年一起找上你。'} };
function renderPhase(){resetStory();renderAll();if(current.phase===0){var x=intros[current.grade];E('eyebrow').textContent='SEASON OPENING';E('storyTitle').textContent=x.title;E('storyText').textContent=x.text;E('continueBtn').classList.remove('hidden')}else if(current.phase===1){E('eyebrow').textContent='PRESEASON TRAINING';E('storyTitle').textContent='季初特訓：2D20';E('storyText').textContent='新球季開始前，你有一段完整的訓練期。兩顆 D20 的總和，就是這一季可以自由分配的訓練點。';var a=d20(),b=d20();current.pool+=a+b;E('diceArea').innerHTML='<div class="diceWrap">'+d20html(a)+d20html(b)+'<div><div class="small">本季訓練點</div><div class="pool">'+(a+b)+'</div></div></div>';addLog('🎲 '+year()+'季初 2D20：'+a+' + '+b+' = '+(a+b));E('continueBtn').classList.remove('hidden');renderAll()}else if(current.phase===2){E('eyebrow').textContent='PLAYER DEVELOPMENT';E('storyTitle').textContent='自由配點';E('storyText').textContent='把點數花在你想打造的能力上。高能力值會需要更多成本，沒花完的點數會保留。';E('continueBtn').classList.remove('hidden');renderAttrs()}else if(current.phase>=3&&current.phase<=7){showYearEvent(current.phase-3)}else seasonSummary()}
function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;addLog('📈 '+names[k]+' '+(current.skills[k]-1)+' → '+current.skills[k]+'（-'+c+'）');renderAll()}
var yearlyEvents={
1:[
{title:'第一次正式上場',text:'第二節剩 4 分 12 秒，教練突然朝板凳末端喊你的名字。你甚至沒想到今天會上場。\n\n一踏進場內，對方後衛立刻朝你這個新人要球單打。',score:'18：24',clock:'第二節 4:12',choices:[{t:'先把防守做好',d:'降低風險，先證明自己不會成為防守漏洞。',keys:['perdef','defiq'],dc:13,s:'你連續守下兩個回合，教練沒有立刻把你換下去。',f:'對方抓住你的站位失誤連續得分，教練很快叫你回板凳。'},{t:'搶機會主動進攻',d:'拿到球就攻，試著用得分讓大家記住你。',keys:['layup','handle','speed'],dc:15,s:'你第一次出手就切進去得分，板凳席傳來學長的吼聲。',f:'你太急著表現，突破掉球，下一個死球立刻被換下。'}]},
{title:'學長在對抗賽故意加強碰撞',text:'練習賽中，三年級學長連續兩個回合把你撞倒。第三次站到你面前時，他笑著說：「高中不是國中。」',choices:[{t:'正面硬碰回去',d:'不退讓，用身體回應。',keys:['strength','stamina'],dc:15,s:'你這次扛住碰撞完成進攻，學長第一次收起笑容。',f:'你想硬扛卻被撞得失去平衡，還被教練提醒別只靠情緒打球。'},{t:'用速度避開身體接觸',d:'改變節奏，不和對方硬撞。',keys:['accel','handle','offiq'],dc:13,s:'你連續用變速甩開對手，逼得學長只能伸手犯規。',f:'學長預判你的路線，直接卡死突破空間。'}]},
{title:'輪替位置只剩一個名額',text:'教練宣布下週開始縮短輪替。你和另一名一年級球員競爭最後一個固定上場名額。最後一場隊內賽前，助教問你想怎麼打。',choices:[{t:'全力進攻搶眼球',d:'用得分證明自己。',keys:['three','layup','offiq'],dc:15,s:'你打出全隊最高效率，教練把你的名字留在輪替名單。',f:'出手選擇太急，效率不佳，競爭對手反而更穩定。'},{t:'做所有髒活',d:'防守、卡位、跑動，不搶球權。',keys:['perdef','dreb','offball'],dc:13,s:'你沒有拿很多分，但教練記住了每一次補防和卡位。',f:'你太保守，整場幾乎沒有存在感。'}]},

{title:'腳踝在比賽前微微不舒服',text:'八強賽前熱身，你落地時右腳踝傳來一陣刺痛。隊醫檢查後說沒有嚴重結構傷，但如果硬打，惡化風險不低。',choices:[{t:'照常出賽',d:'接受風險，不想錯過最後一屆 HBL。',keys:['stamina','strength'],dc:16,s:'你撐完整場，而且腳踝沒有進一步惡化。',f:'比賽中再次翻船，後半場幾乎失去爆發力。'},{t:'限制上場時間',d:'保留關鍵時刻，降低負荷。',keys:['offiq','stamina'],dc:13,s:'你把有限的時間用在最重要的回合。',f:'節奏斷斷續續，始終找不到比賽感。'}]},

function showYearEvent(slot){var order=current.eventOrder[current.grade];var ev=yearlyEvents[current.grade][order[slot]];current.event=ev;E('eyebrow').textContent=year()+' STORY '+(slot+1)+'/5';E('storyTitle').textContent=ev.title;if(ev.score)E('scoreboard').innerHTML='<div class="scoreboard"><div class="board"><span class="small">比分</span><br><b>'+ev.score+'</b></div><div class="board"><span class="small">時間</span><br><b class="clock">'+ev.clock+'</b></div></div>';E('storyText').textContent=ev.text;E('choices').innerHTML=ev.choices.map((c,i)=>'<button class="choice" onclick="resolveChoice('+i+')"><strong>'+c.t+'</strong><span>'+c.d+'</span><span class="test">考驗：'+c.keys.map(k=>names[k]).join('＋')+'｜DC '+c.dc+'</span></button>').join('')}
function resolveChoice(i){var c=current.event.choices[i];var skill=Math.round(avg(c.keys.map(k=>current.skills[k])));var mod=Math.floor((skill-50)/10);var roll=d20();var total=roll+mod;var ok=roll===20||total>=c.dc;E('choices').innerHTML='';E('diceArea').innerHTML='<div class="diceWrap">'+d20html(roll)+'<div><div class="small">能力平均 '+skill+'｜修正 '+(mod>=0?'+':'')+mod+'</div><div style="font-size:27px;font-weight:900">最終 '+total+' vs DC '+c.dc+'</div></div></div>';E('result').className='result '+(ok?'success':'fail');E('result').innerHTML='<b>'+(ok?'✅ 成功':'❌ 失敗')+'</b><br>'+(roll===20?'Natural 20！'+c.s:roll===1?'Natural 1。'+c.f:(ok?c.s:c.f));if(ok)current.pool+=1;addLog((ok?'✅ ':'❌ ')+year()+'：'+current.event.title+'｜'+c.t);E('continueBtn').classList.remove('hidden')}
function seasonSummary(){E('eyebrow').textContent='SEASON END';E('storyTitle').textContent=year()+'賽季結束';var rating=ovr(current)+Math.floor(rng()*15)-5;var p=Math.max(3,Math.round((rating-40)*.42));var r=Math.max(1,Math.round((current.skills.dreb+current.skills.oreb-70)/18));var a=Math.max(1,Math.round((current.skills.pass+current.skills.vision-70)/18));E('storyText').textContent='五個重要片段之後，這個球季終於告一段落。\n\n場均 '+p+' 分｜'+r+' 籃板｜'+a+' 助攻\n\n目前 OVR：'+ovr(current)+'｜剩餘訓練點：'+current.pool;E('continueBtn').textContent=current.grade<3?'進入下一學年':'完成 HBL 生涯';E('continueBtn').classList.remove('hidden')}
function advance(){if(current.phase<8){current.phase++;renderPhase();return}if(current.grade<3){current.grade++;current.phase=0;prepareYear();addLog('📅 進入 HBL '+year()+'。');renderPhase()}else{E('eyebrow').textContent='HBL COMPLETE';E('storyTitle').textContent='你的高中生涯完成了';E('storyText').textContent='三年、十五個重要事件之後，你的 HBL 生涯正式結束。下一階段將從升學與職業邀請開始。';E('continueBtn').classList.add('hidden')}}
</script></body></html>
