<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.0.1</title><style>
:root{--bg:#090d12;--panel:#141b25;--panel2:#0f151d;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.topbar{margin-bottom:16px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:rgba(20,27,37,.98);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 32px rgba(0,0,0,.18)}h2{margin:0 0 12px;font-size:18px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#1c1305;border:0}.ghost{background:#111923}.hidden{display:none!important}.note{font-size:13px;line-height:1.65;color:#c9d2dd;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}.players{display:grid;gap:10px}.player{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px}.playerhead{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:900}.score{font-size:24px;font-weight:900;color:var(--orange)}
.career{display:grid;grid-template-columns:245px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:24px;font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:#202a38;border:1px solid var(--line)}.ovr{font-size:42px;font-weight:950;margin:6px 0}.pool{font-size:32px;font-weight:950;color:var(--orange)}.progress{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#111923;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a;border-color:#6f4b0d}.step.done{color:var(--green)}
.storyCard{min-height:350px}.eyebrow{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:.05em;margin-bottom:7px}.storyTitle{font-size:27px;font-weight:950;margin-bottom:10px}.story{font-size:16px;line-height:1.9;color:#e7edf4;white-space:pre-line}.scoreboard{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.board{background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:10px 13px}.board b{font-size:21px}.clock{color:var(--orange)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}.choice{text-align:left;background:#121b27;padding:14px;border:1px solid #314158}.choice strong{display:block;font-size:15px}.choice span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.55}.test{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:7px;background:#1c2634;color:#c9dcf5}.result{margin-top:15px;background:#0f151e;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}
.diceWrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0}.d20{width:96px;height:96px;position:relative;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:drop .5s ease-out}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;text-shadow:0 2px 5px #000}@keyframes drop{0%{transform:translateY(-28px) rotate(-18deg) scale(.82);opacity:0}75%{transform:translateY(3px) rotate(4deg) scale(1.04)}100%{transform:none;opacity:1}}
.attrCard{margin-top:16px}.attrTabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:10px}.tab{width:auto;white-space:nowrap;background:#111923;padding:8px 12px}.tab.active{background:#26364a;border-color:#55759e}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:10px}.attrTop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.attrName{font-size:12px;color:#ccd6e2}.attrVal{font-size:22px;font-weight:950}.cost{font-size:11px;color:var(--muted);margin-top:2px}.plus{margin-top:7px;padding:7px;background:#243247}.plus:disabled{opacity:.35}.bar{height:5px;background:#090e14;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.log{max-height:230px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:12px;padding:10px}.log p{margin:0 0 8px;line-height:1.5}
@media(max-width:950px){.career{grid-template-columns:1fr}.side{position:static}.setup{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.choices{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}.attr{padding:9px}.attrVal{font-size:20px}}
</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.0.1</span></h1><div class="small">D20 生涯測試｜平衡式能力網格｜關鍵回合事件</div></div>
<div id="setup" class="setup"><div><div class="card"><h2>① 球員基本資料</h2><div class="note">固定從 HBL 高一開始。球員類型由能力組合自然形成。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div class="row"><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div></div><button class="primary" onclick="generatePlayer()">生成球員</button></div><div class="card" style="margin-top:16px"><h2>② 事件 Seed</h2><div class="note">Seed 只控制事件與事件 D20，不影響球員生成。</div><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>③ 生成過的球員</h2><div id="players" class="players"><div class="small">尚未生成球員。</div></div></div></div>
<div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage">HBL 高一</div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:13px">OVR</div><div id="ovr" class="ovr">--</div><div class="small">剩餘訓練點</div><div id="pool" class="pool">0</div></div></aside><main><div id="progress" class="progress"></div><div class="card storyCard"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card attrCard"><h2>能力值</h2><div class="small" style="margin-bottom:9px">分類橫向切換，能力本身使用網格排列：桌機 4 欄、平板 3 欄、手機 2 欄。</div><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card" style="margin-top:16px"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="location.reload()">← 回首頁</button></div></main></div></div>
<script>
var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';var groups={'進攻':['finish','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};var names={finish:'禁區終結',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};var phases=['季前','2D20 特訓','自由配點','關鍵事件','賽季結算'];
function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function cost(v){if(v<60)return 1;if(v<70)return 2;if(v<75)return 3;if(v<80)return 4;if(v<85)return 5;if(v<90)return 7;if(v<95)return 10;if(v<98)return 15;if(v<99)return 20;return 999}function ovr(p){return Math.round(avg(Object.values(p.skills)))}
function archetype(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=80&&s.three>=80&&s.block>=85)return'獨角獸';if(h>=205&&s.pass>=85&&s.vision>=86&&s.dreb>=80)return'全能組織長人';if(h>=198&&s.handle>=85&&s.pass>=82)return'控球前鋒';if(s.three>=85&&s.perdef>=84)return'3&D';if(s.pass>=88&&s.vision>=88&&s.handle>=86)return'進攻發動機';return'尚未定型'}
function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(44,61);Object.keys(names).forEach(k=>p.skills[k]=clamp(base+ri(-9,11),28,76));p.skills.finish+=Math.round((p.height-195)/5);p.skills.dunk+=Math.round((p.height-195)/3);p.skills.intdef+=Math.round((p.height-195)/3);p.skills.block+=Math.round((p.wingspan-p.height)/2.5);p.skills.dreb+=Math.round((p.wingspan-p.height)/3);p.skills.strength+=Math.round((p.weight-88)/5);if(p.height>208){p.skills.handle-=Math.round((p.height-208)/4);p.skills.accel-=Math.round((p.height-208)/5)}Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],25,86));roster.push(p);renderRoster()}
function renderRoster(){E('players').innerHTML=roster.map(p=>'<div class="player"><div class="playerhead"><div><div class="name">'+p.name+'</div><div class="small">'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜'+archetype(p)+'</div></div><div class="score">'+ovr(p)+'</div></div><button class="primary" style="margin-top:9px" onclick="startCareer('+p.id+')">開始人生</button></div>').join('')}
function startCareer(id){var p=roster.find(x=>x.id===id);current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.phase=0;current.pool=0;current.log=[];rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');addLog('🏁 '+current.name+' 開始 HBL 高一生涯。');renderAll();renderPhase()}function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function year(){return current.grade===1?'高一':current.grade===2?'高二':'高三'}
function renderAll(){E('stage').textContent='HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>';renderProgress();renderTabs();renderAttrs()}function renderProgress(){E('progress').innerHTML=phases.map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}function renderAttrs(){var can=current&&current.phase===2;E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return '<div class="attr"><div class="attrTop"><span class="attrName">'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}
function d20html(n){return '<div class="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 92,28 82,78 50,97 18,78 8,28" fill="#b86b08" stroke="#ffd18a" stroke-width="2"/><polygon points="50,3 50,50 8,28" fill="#7f4705"/><polygon points="50,3 92,28 50,50" fill="#d18411"/><polygon points="8,28 50,50 18,78" fill="#a35d08"/><polygon points="92,28 82,78 50,50" fill="#915006"/><polygon points="18,78 50,50 50,97" fill="#c3730b"/><polygon points="82,78 50,97 50,50" fill="#6f3d04"/></svg><div class="num">'+n+'</div></div>'}function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('result').className='result hidden';E('continueBtn').classList.add('hidden')}
function renderPhase(){resetStory();renderAll();if(current.phase===0){E('eyebrow').textContent='SEASON OPENING';E('storyTitle').textContent='第一次站上高中球場';E('storyText').textContent='球館的木地板比你記憶中更亮，學長的碰撞也比國中更重。教練沒有給你任何保證，只把戰術板遞給助教，說：「讓他自己爭。」\n\n你知道，從今天開始，每一次選擇都可能改變你在球隊的位置。';E('continueBtn').classList.remove('hidden')}else if(current.phase===1){E('eyebrow').textContent='PRESEASON TRAINING';E('storyTitle').textContent='季初特訓：擲出你的 2D20';E('storyText').textContent='兩顆二十面骰決定這一季你能掌握多少訓練資源。骰到的總和不會自動分配，全部由你自己決定怎麼養成。';var a=d20(),b=d20();current.pool+=a+b;E('diceArea').innerHTML='<div class="diceWrap">'+d20html(a)+d20html(b)+'<div><div class="small">本季訓練點</div><div class="pool">'+(a+b)+'</div></div></div>';addLog('🎲 季初 2D20：'+a+' + '+b+' = '+(a+b)+' 點。');E('continueBtn').classList.remove('hidden');renderAll()}else if(current.phase===2){E('eyebrow').textContent='PLAYER DEVELOPMENT';E('storyTitle').textContent='自由配點';E('storyText').textContent='現在由你決定這季的成長方向。切換下方能力分類，把訓練點花在你真正想打造的能力上。高能力值需要更多點數。';E('continueBtn').classList.remove('hidden');renderAttrs()}else if(current.phase===3){showClutchEvent()}else{seasonSummary()}}
function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;addLog('📈 '+names[k]+' '+(current.skills[k]-1)+' → '+current.skills[k]+'（-'+c+'）');renderAll()}
var clutchEvents=[{title:'最後 8.4 秒，你拿到最後一攻',score:'68：70',clock:'8.4 秒',text:'球隊落後兩分。暫停結束後，教練把戰術板闔起來，只說：「球給你，你決定。」對手已經換上最好的單防者，全場觀眾都站了起來。',choices:[{t:'自行單打衝擊禁區，挑戰 2+1',d:'硬吃第一線防守，嘗試在身體接觸下完成進球。',keys:['finish','foulDraw','strength'],dc:15},{t:'直接強拔三分',d:'不浪費時間，靠單打創造空間直接出手。',keys:['three','handle'],dc:16},{t:'切入吸引協防後分球',d:'先突破防線，再把球交給出現空檔的隊友。',keys:['handle','pass','vision'],dc:14}]},{title:'第四節剩 42 秒，對手開始全場壓迫',score:'61：60',clock:'42 秒',text:'你們只領先一分，對手直接祭出全場包夾。教練沒有叫暫停，他想看看你能不能自己解決。你在底線接到球，兩名防守者立刻逼了上來。',choices:[{t:'靠控球硬闖過半場',d:'用速度與運球突破雙人壓迫。',keys:['handle','accel','speed'],dc:15},{t:'提前長傳破解包夾',d:'在第二名防守者收縮前，把球送到前場。',keys:['pass','vision','offiq'],dc:14},{t:'護球等隊友回接',d:'降低失誤風險，但可能被逼出 8 秒違例。',keys:['strength','handle','offiq'],dc:13}]},{title:'你被換去守對方王牌',score:'74：74',clock:'1:12',text:'對方王牌已經連拿 9 分。死球時，教練指著他，再指向你：「接下來他交給你。」下一個回合，他在弧頂要球，全場都知道他會單打。',choices:[{t:'貼身壓迫，不讓他舒服出手',d:'提高身體接觸，逼迫對方改變節奏。',keys:['perdef','strength','defiq'],dc:15},{t:'放半步，誘導他往弱側切入',d:'用判斷與腳步把對手帶進預設陷阱。',keys:['perdef','defiq','speed'],dc:14},{t:'賭一把直接抄球',d:'成功就是反快攻，失敗就可能被一步過。',keys:['steal','speed'],dc:17}]}];
function showClutchEvent(){var ev=clutchEvents[Math.floor(rng()*clutchEvents.length)];current.event=ev;E('eyebrow').textContent='CLUTCH MOMENT';E('storyTitle').textContent=ev.title;E('scoreboard').innerHTML='<div class="scoreboard"><div class="board"><span class="small">比分</span><br><b>'+ev.score+'</b></div><div class="board"><span class="small">時間</span><br><b class="clock">'+ev.clock+'</b></div></div>';E('storyText').textContent=ev.text;E('choices').innerHTML=ev.choices.map((c,i)=>'<button class="choice" onclick="resolveChoice('+i+')"><strong>'+c.t+'</strong><span>'+c.d+'</span><span class="test">考驗：'+c.keys.map(k=>names[k]).join('＋')+'｜DC '+c.dc+'</span></button>').join('')}
function resolveChoice(i){var c=current.event.choices[i];var skill=Math.round(avg(c.keys.map(k=>current.skills[k])));var mod=Math.floor((skill-50)/10);var roll=d20();var total=roll+mod;var ok=roll===20||total>=c.dc;E('choices').innerHTML='';E('diceArea').innerHTML='<div class="diceWrap">'+d20html(roll)+'<div><div class="small">能力平均 '+skill+'｜修正 '+(mod>=0?'+':'')+mod+'</div><div style="font-size:27px;font-weight:900">最終 '+total+' vs DC '+c.dc+'</div></div></div>';E('result').className='result '+(ok?'success':'fail');if(ok){E('result').innerHTML='<b>✅ 成功</b><br>'+successText(c.t,roll);current.pool+=2;addLog('🔥 關鍵回合成功：'+c.t+'。')}else{E('result').innerHTML='<b>❌ 失敗</b><br>'+failText(c.t,roll);addLog('💥 關鍵回合失敗：'+c.t+'。')}E('continueBtn').classList.remove('hidden')}
function successText(t,r){if(r===20)return'Natural 20！你不只完成戰術，還打出一個全場會記住的回合。額外獲得 2 點訓練點。';if(t.includes('2+1'))return'你扛住碰撞把球擦板放進，裁判哨聲同時響起。板凳席全部衝了起來。';if(t.includes('三分'))return'防守者已經封到臉上，但球仍乾淨地穿網。全場瞬間炸開。';if(t.includes('分球'))return'協防被你完全吸走，底角隊友得到大空檔，穩穩命中。';return'你的選擇奏效，這個回合被你處理得很漂亮。'}function failText(t,r){if(r===1)return'Natural 1。你在最糟的時間做出錯誤判斷，這個回合會成為賽後反覆播放的畫面。';if(t.includes('三分'))return'球砸在籃框後緣彈出，時間也跟著走完。';if(t.includes('2+1'))return'你衝進禁區卻沒要到哨音，出手在干擾下偏掉。';if(t.includes('分球'))return'協防提前讀到你的傳球路線，球被直接抄走。';return'對手讀懂了你的選擇，這次沒有成功。'}
function seasonSummary(){E('eyebrow').textContent='SEASON END';E('storyTitle').textContent=year()+'賽季結束';var rating=ovr(current)+Math.floor(rng()*15)-5;var p=Math.max(3,Math.round((rating-40)*.42));var r=Math.max(1,Math.round((current.skills.dreb+current.skills.oreb-70)/18));var a=Math.max(1,Math.round((current.skills.pass+current.skills.vision-70)/18));E('storyText').textContent='整個球季告一段落。你的能力、關鍵回合與球隊角色共同塑造了這一年。\n\n場均 '+p+' 分｜'+r+' 籃板｜'+a+' 助攻\n\n目前 OVR：'+ovr(current)+'｜剩餘訓練點：'+current.pool;E('continueBtn').textContent=current.grade<3?'進入下一學年':'完成 HBL 生涯';E('continueBtn').classList.remove('hidden')}
function advance(){if(current.phase<4){current.phase++;renderPhase();return}if(current.grade<3){current.grade++;current.phase=0;renderPhase()}else{E('eyebrow').textContent='HBL COMPLETE';E('storyTitle').textContent='你的高中生涯完成了';E('storyText').textContent='三年的 HBL 生涯結束。下一版再接升學與職業路線。';E('continueBtn').classList.add('hidden')}}
</script></body></html>
