<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.6</title><style>:root{--bg:#090d12;--panel:#141b25;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1260px;margin:auto;padding:18px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:#141b25;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.hidden{display:none!important}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#211504;border:0}.ghost{background:#111923}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.note{font-size:13px;line-height:1.7;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px;color:#cbd5e1}.players{display:grid;gap:9px}.player{background:#0f151d;border:1px solid var(--line);border-radius:13px;padding:12px}.career{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:23px;font-weight:900}.name{font-size:17px;font-weight:900}.ovr{font-size:42px;font-weight:950}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;background:#202a38;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.sideStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{background:#0e151e;border:1px solid var(--line);border-radius:10px;padding:8px}.mini b{display:block;font-size:20px}.titleBox{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.titleList{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.titleChip{font-size:11px;padding:6px 8px;border-radius:999px;background:#312916;border:1px solid #735f28;color:#ffe39a}.titleChip.special{background:#302047;border-color:#7553a6;color:#e0c7ff}.noTitle{font-size:11px;color:var(--muted)}.progress{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a}.step.done{color:var(--green)}.eyebrow{font-size:12px;color:var(--blue);font-weight:900}.storyTitle{font-size:27px;font-weight:950;margin:6px 0 12px}.story{font-size:16px;line-height:1.95;white-space:pre-line;color:#e7edf4}.scoreboard{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.board{background:#0b1118;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.choices,.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:17px}.choice,.offer{text-align:left;background:#121b27;border:1px solid #314158;padding:14px;border-radius:12px}.choice strong,.offer strong{display:block}.choice span,.offer span{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.55}.offer .country{color:var(--blue);font-size:11px}.offer .offerName{font-size:18px;font-weight:900;color:var(--txt)}.badge{display:inline-block!important;width:auto;margin-right:4px;padding:4px 7px;border-radius:7px;background:#1c2634}.chance{background:#173126;color:#9df0c6!important}.reward{background:#322b16;color:#ffe49a!important}.risk{background:#351d24;color:#ffb1c0!important}.titleBonus{background:#33284b;color:#d7c3ff!important}.stageBonus{background:#173044;color:#afd9ff!important}.result{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}.diceWrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:15px 0}.d20{width:92px;height:92px;position:relative}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:950}.attrTabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{width:auto;white-space:nowrap}.tab.active{background:#26364a}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:11px;padding:10px}.attrTop{display:flex;justify-content:space-between}.attrVal{font-size:21px;font-weight:900}.cost{font-size:11px;color:var(--muted)}.bar{height:5px;background:#090e14;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.plus{margin-top:7px}.log{max-height:250px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:10px}.log p{margin:0 0 7px}@media(max-width:950px){.career,.setup{grid-template-columns:1fr}.side{position:static}.attrGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.choices,.offers{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.6</span></h1><div class="small">50–60 基礎能力區｜高一新秀友善難度｜半架空學校與球隊｜普通／特殊稱號</div></div><div id="setup" class="setup"><div><div class="card"><h2>球員基本資料</h2><div class="note">高一新生的多數能力會落在 50～60 左右；少數強項可更高、弱項可略低。60 以前升級仍是 1 點升 1 級。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div><button class="primary" style="margin-top:12px" onclick="generatePlayer()">生成並開始生涯</button></div><div class="card"><h2>事件 Seed</h2><div class="note">Seed 不參與初始能力生成，只控制事件順序、D20 與部分邀約。</div><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>曾創建過的球員</h2><div id="players" class="players"><div class="small">尚未創建球員。</div></div></div></div><div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage"></div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:12px">OVR</div><div id="ovr" class="ovr"></div><div class="sideStats"><div class="mini"><span class="small">訓練點</span><b id="pool"></b></div><div class="mini"><span class="small">教練信任</span><b id="trust"></b></div><div class="mini"><span class="small">球探關注</span><b id="scout"></b></div><div class="mini"><span class="small">成功事件</span><b id="wins"></b></div><div class="mini"><span class="small">MVP</span><b id="mvps"></b></div><div class="mini"><span class="small">冠軍</span><b id="rings"></b></div></div><div class="titleBox"><span class="small">稱號</span><div id="titles" class="titleList"></div></div></div></aside><main><div id="progress" class="progress"></div><div class="card"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="offers" class="offers hidden"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card"><h2>能力值</h2><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="backHome()">← 回首頁</button></div></main></div></div><script>var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';var groups={'進攻':['touch','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};var names={touch:'近框手感',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function ovr(p){return Math.round(avg(Object.values(p.skills)))}function cost(v){if(v<60)return 1;if(v<70)return 2;if(v<80)return 3;if(v<85)return 4;if(v<90)return 6;if(v<95)return 9;if(v<98)return 14;if(v<99)return 20;return 999}function phases(){return['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']}function archetype(p){var s=p.skills,h=p.height;if(h>=213&&s.handle>=82&&s.three>=82&&s.block>=84)return'獨角獸';if(h>=203&&s.pass>=82&&s.vision>=82)return'全能組織長人';if(h>=196&&s.handle>=82&&s.pass>=78)return'控球前鋒';if(s.three>=82&&s.perdef>=80)return'3&D';return'尚未定型'}function abilityBonus(v){if(v<45)return-2;if(v<50)return-1;if(v<60)return 0;if(v<70)return 1;if(v<80)return 2;if(v<90)return 3;if(v<95)return 4;return 5}function stageBonus(){if(current.level==='hbl')return current.grade===1?4:current.grade===2?2:1;if(current.level==='college')return current.collegeTier==='tw'?1:current.collegeTier==='d1'?-1:0;if(current.level==='pro')return -(current.league.diff||0);return 0}function stageLabel(){if(current.level==='hbl'&&current.grade===1)return'高一新秀保護 +4';if(current.level==='hbl'&&current.grade===2)return'高二成長修正 +2';var b=stageBonus();return b>0?'時期修正 +'+b:b<0?'層級修正 '+b:'標準難度'}function eventType(c){var best='進攻',score=-1;Object.keys(groups).forEach(g=>{var n=c.keys.filter(k=>groups[g].includes(k)).length;if(n>score){score=n;best=g}});return best}var titleDefs=[{id:'s80',name:'射手',special:false,bonus:1,keys:['three'],desc:'三分事件 +1',cond:p=>p.skills.three>=80},{id:'s90',name:'神射手',special:false,bonus:2,keys:['three'],desc:'三分事件 +2',cond:p=>p.skills.three>=90},{id:'s95',name:'超級射手',special:false,bonus:3,keys:['three'],desc:'三分事件 +3',cond:p=>p.skills.three>=95},{id:'h80',name:'控球高手',special:false,bonus:1,keys:['handle'],desc:'控球事件 +1',cond:p=>p.skills.handle>=80},{id:'rim80',name:'護框者',special:false,bonus:1,keys:['block','intdef'],desc:'護框事件 +1',cond:p=>p.skills.block>=80},{id:'arsenal',name:'進攻萬花筒',special:false,bonus:2,types:['進攻'],desc:'進攻事件 +2',cond:p=>groups['進攻'].filter(k=>p.skills[k]>=78).length>=4},{id:'era',name:'時代標誌',special:true,bonus:2,types:['ALL'],desc:'3 次 MVP｜所有事件 +2',cond:p=>p.mvpCount>=3},{id:'dynasty',name:'王朝稱霸',special:true,bonus:2,types:['ALL'],desc:'連續 3 冠｜所有事件 +2',cond:p=>p.consecutiveTitles>=3},{id:'clutch',name:'大心臟',special:true,bonus:1,types:['ALL'],desc:'8 次關鍵事件成功｜所有事件 +1',cond:p=>p.clutchWins>=8}];function titleApplies(t,c){return(t.types&&(t.types.includes('ALL')||t.types.includes(eventType(c))))||(t.keys&&t.keys.some(k=>c.keys.includes(k)))}function titleBonus(c){var best=0,spec=0;(current.titles||[]).forEach(id=>{var t=titleDefs.find(x=>x.id===id);if(t&&titleApplies(t,c)){if(t.special)spec+=t.bonus;else best=Math.max(best,t.bonus)}});return clamp(best+spec,0,5)}function titleNamesFor(c){return(current.titles||[]).map(id=>titleDefs.find(x=>x.id===id)).filter(t=>t&&titleApplies(t,c)).map(t=>t.name)}function checkTitles(){current.titles=current.titles||[];titleDefs.forEach(t=>{if(!current.titles.includes(t.id)&&t.cond(current)){current.titles.push(t.id);addLog('🏅 獲得'+(t.special?'特殊':'普通')+'稱號【'+t.name+'】｜'+t.desc)}});renderTitles()}function renderTitles(){E('titles').innerHTML=!current||!current.titles||!current.titles.length?'<span class="noTitle">尚未取得稱號</span>':current.titles.map(id=>{var t=titleDefs.find(x=>x.id===id);return'<span class="titleChip '+(t.special?'special':'')+'">【'+t.name+'】</span>'}).join('')}function successChance(v,dc,tb){var bonus=abilityBonus(v)+stageBonus()+(tb||0),ok=0;for(var r=1;r<=20;r++)if(r===20||(r!==1&&r+bonus>=dc))ok++;return ok*5}function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(52,58);Object.keys(names).forEach(k=>p.skills[k]=base+ri(-5,7));p.skills.touch+=Math.round((p.height-195)/10);p.skills.dunk+=Math.round((p.height-195)/7);p.skills.intdef+=Math.round((p.height-195)/7);p.skills.block+=Math.round((p.wingspan-p.height)/5);p.skills.dreb+=Math.round((p.wingspan-p.height)/6);p.skills.strength+=Math.round((p.weight-88)/8);if(p.height>208){p.skills.handle-=Math.round((p.height-208)/7);p.skills.accel-=Math.round((p.height-208)/8)}Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],45,68));roster.push(JSON.parse(JSON.stringify(p)));renderRoster();startCareer(p)}function renderRoster(){E('players').innerHTML=roster.map((p,i)=>'<div class="player"><b>'+p.name+'</b><div class="small">#'+(i+1)+'｜'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜初始 OVR '+ovr(p)+'</div></div>').join('')||'<div class="small">尚未創建球員。</div>'}function startCareer(p){current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.level='hbl';current.phase=0;current.pool=0;current.trust=50;current.scout=0;current.wins=0;current.titles=[];current.mvpCount=0;current.championships=0;current.consecutiveTitles=0;current.clutchWins=0;current.log=[];current.eventOrder={};rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');prepareYear();addLog('🏁 '+current.name+' 的 HBL 生涯開始。');renderPhase()}function backHome(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster();scrollTo(0,0)}function year(){if(current.level==='college')return'大'+['一','二','三','四'][current.collegeYear-1];if(current.level==='pro')return'職業第 '+current.proYear+' 季';return current.grade===1?'高一':current.grade===2?'高二':'高三'}function keyYear(){return current.level[0]+(current.level==='hbl'?current.grade:current.level==='college'?current.collegeYear:current.proYear)}function prepareYear(){var arr=[0,1,2,3,4];for(var i=4;i>0;i--){var j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}current.eventOrder[keyYear()]=arr}function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function renderAll(){var st=current.level==='hbl'?'HBL '+year():current.level==='college'?(current.school?current.school.name:'大學')+' '+year():current.level==='pro'?(current.team||'職業')+'｜'+year():'招募階段';E('stage').textContent=st;E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('trust').textContent=current.trust;E('scout').textContent=current.scout;E('wins').textContent=current.wins;E('mvps').textContent=current.mvpCount;E('rings').textContent=current.championships;var extra=current.school?'<span class="chip">'+current.school.name+'</span>':current.team?'<span class="chip">'+current.league.name+'</span>':'';E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>'+extra;renderTitles();renderProgress();renderTabs();renderAttrs()}function renderProgress(){E('progress').innerHTML=(current.level==='offers'||current.level==='proOffers')?'':phases().map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}function renderAttrs(){if(!current)return;var can=current.phase===2&&['hbl','college','pro'].includes(current.level);E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return'<div class="attr"><div class="attrTop"><span>'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;addLog('📈 '+names[k]+' → '+current.skills[k]+'（-'+c+'）');checkTitles();renderAll()}function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('offers').innerHTML='';E('offers').classList.add('hidde lege'?clamp((rating-70)*3,0,30):clamp((rating-64)*2,0,20);var titleChance=current.level==='pro'?clamp((rating-72)*3,0,45):clamp((rating-66)*2,0,30);var mvp=rng()*100<mvpChance,champ=rng()*100<titleChance;if(mvp){current.mvpCount++;addLog('🏆 '+year()+' 獲得 MVP')}if(champ){current.championships++;current.consecutiveTitles++;addLog('🏆 '+year()+' 奪得冠軍')}else current.consecutiveTitles=0;checkTitles();E('storyText').textContent='教練信任 '+current.trust+'｜球探關注 '+current.scout+'｜OVR '+ovr(current)+'\n事件成功 '+current.wins+' 次\n\n'+(mvp?'🏅 本季 MVP\n':'')+(champ?'🏆 本季冠軍\n':'')+'生涯 MVP：'+current.mvpCount+'｜生涯冠軍：'+current.championships;E('continueBtn').textContent=current.level==='hbl'?(current.grade<3?'進入下一學年':'查看大學邀約'):current.level==='college'?(current.collegeYear<4?'進入下一學年':'進入職業市場'):'進入休賽季／職業市場';E('continueBtn').classList.remove('hidden')}function advance(){if(current.level==='offers'||current.level==='proOffers')return;if(current.phase<8){current.phase++;renderPhase();return}if(current.level==='hbl'){if(current.grade<3){current.grade++;current.phase=0;prepareYear();addLog('📅 進入 HBL '+year());renderPhase()}else showCollegeOffers();return}if(current.level==='college'){if(current.collegeYear<4){current.collegeYear++;current.phase=0;current.trust=Math.max(38,current.trust-3);prepareYear();addLog('📅 '+current.school.name+' '+year());renderPhase()}else showProOffers();return}if(current.level==='pro')showProOffers()}</script></body></html>
