<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.3</title><style>:root{--bg:#090d12;--panel:#141b25;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:#141b25;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.hidden{display:none!important}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#211504;border:0}.ghost{background:#111923}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.note{font-size:13px;line-height:1.7;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px;color:#cbd5e1}.players{display:grid;gap:9px}.player{background:#0f151d;border:1px solid var(--line);border-radius:13px;padding:12px}.career{display:grid;grid-template-columns:255px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:23px;font-weight:900}.name{font-size:17px;font-weight:900}.ovr{font-size:42px;font-weight:950}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;background:#202a38;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.sideStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{background:#0e151e;border:1px solid var(--line);border-radius:10px;padding:8px}.mini b{display:block;font-size:20px}.titleBox{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.titleList{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.titleChip{font-size:11px;padding:6px 8px;border-radius:999px;background:#312916;border:1px solid #735f28;color:#ffe39a}.noTitle{font-size:11px;color:var(--muted)}.progress{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a}.step.done{color:var(--green)}.eyebrow{font-size:12px;color:var(--blue);font-weight:900}.storyTitle{font-size:27px;font-weight:950;margin:6px 0 12px}.story{font-size:16px;line-height:1.95;white-space:pre-line;color:#e7edf4}.scoreboard{display:flex;gap:10px;margin:10px 0}.board{background:#0b1118;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.choices,.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:17px}.choice,.offer{text-align:left;background:#121b27;border:1px solid #314158;padding:14px;border-radius:12px}.choice strong,.offer strong{display:block}.choice span,.offer span{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.55}.badge{display:inline-block!important;width:auto;margin-right:4px;padding:4px 7px;border-radius:7px;background:#1c2634}.chance{background:#173126;color:#9df0c6!important}.reward{background:#322b16;color:#ffe49a!important}.risk{background:#351d24;color:#ffb1c0!important}.titleBonus{background:#33284b;color:#d7c3ff!important}.result{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}.diceWrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:15px 0}.d20{width:92px;height:92px;position:relative}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:950}.attrTabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{width:auto;white-space:nowrap}.tab.active{background:#26364a}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:11px;padding:10px}.attrTop{display:flex;justify-content:space-between}.attrVal{font-size:21px;font-weight:900}.cost{font-size:11px;color:var(--muted)}.bar{height:5px;background:#090e14;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.plus{margin-top:7px}.log{max-height:220px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:10px}.log p{margin:0 0 7px}.offer .country{color:var(--blue);font-size:11px}.offer .offerName{font-size:18px;font-weight:900;color:var(--txt)}@media(max-width:950px){.career,.setup{grid-template-columns:1fr}.side{position:static}.attrGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.choices,.offers{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.3</span></h1><div class="small">事件成功率重平衡｜新增稱號系統｜Seed 仍只控制生涯事件</div></div><div id="setup" class="setup"><div><div class="card"><h2>球員基本資料</h2><div class="note">高一從尚未成熟的球員開始。身材會影響部分初始能力，但不形成硬上限。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div><button class="primary" style="margin-top:12px" onclick="generatePlayer()">生成並開始生涯</button></div><div class="card"><h2>事件 Seed</h2><div class="note">Seed <b>不參與球員數值生成</b>，只決定事件順序、事件 D20 與部分生涯分歧。</div><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>曾創建過的球員</h2><div id="players" class="players"><div class="small">尚未創建球員。</div></div></div></div><div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage"></div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:12px">OVR</div><div id="ovr" class="ovr"></div><div class="sideStats"><div class="mini"><span class="small">訓練點</span><b id="pool"></b></div><div class="mini"><span class="small">教練信任</span><b id="trust"></b></div><div class="mini"><span class="small">球探關注</span><b id="scout"></b></div><div class="mini"><span class="small">成功事件</span><b id="wins"></b></div></div><div class="titleBox"><span class="small">稱號</span><div id="titles" class="titleList"></div></div></div></aside><main><div id="progress" class="progress"></div><div class="card"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="offers" class="offers hidden"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card"><h2>能力值</h2><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="backHome()">← 回首頁</button></div></main></div></div><script>var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';var groups={'進攻':['touch','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};var names={touch:'近框手感',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function ovr(p){return Math.round(avg(Object.values(p.skills)))}function cost(v){if(v<50)return 1;if(v<60)return 2;if(v<70)return 3;if(v<75)return 4;if(v<80)return 5;if(v<85)return 7;if(v<90)return 10;if(v<95)return 15;if(v<98)return 20;return 999}function archetype(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=80&&s.three>=80&&s.block>=85)return'獨角獸';if(h>=205&&s.pass>=82&&s.vision>=82)return'全能組織長人';if(h>=198&&s.handle>=82&&s.pass>=80)return'控球前鋒';if(s.three>=82&&s.perdef>=80)return'3&D';return'尚未定型'}function phases(){return['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']}function abilityBonus(v){return clamp(Math.floor((v-45)/10),-2,5)}function checkTarget(dc){return clamp(10+Math.floor((dc-11)/2),8,15)}function eventType(c){var best='進攻',score=-1;Object.keys(groups).forEach(g=>{var n=c.keys.filter(k=>groups[g].includes(k)).length;if(n>score){score=n;best=g}});return best}var titleDefs=[{id:'arsenal',name:'進攻萬花筒',types:['進攻'],bonus:2,desc:'進攻型事件檢定 +2',cond:p=>avg(groups['進攻'].map(k=>p.skills[k]))>=58&&groups['進攻'].filter(k=>p.skills[k]>=60).length>=4},{id:'floorGeneral',name:'球場指揮官',types:['組織'],bonus:2,desc:'組織型事件檢定 +2',cond:p=>avg(['handle','pass','vision','offiq'].map(k=>p.skills[k]))>=59},{id:'lock',name:'外線大鎖',types:['防守'],bonus:2,desc:'防守型事件檢定 +2',cond:p=>avg(['perdef','defiq','steal'].map(k=>p.skills[k]))>=59},{id:'fortress',name:'禁區堡壘',types:['防守','籃板'],bonus:2,desc:'防守／籃板事件檢定 +2',cond:p=>avg(['intdef','block','dreb'].map(k=>p.skills[k]))>=60},{id:'engine',name:'體能怪物',types:['身體'],bonus:2,desc:'身體型事件檢定 +2',cond:p=>avg(['speed','accel','explosion','stamina'].map(k=>p.skills[k]))>=62},{id:'clutch',name:'大心臟',types:['ALL'],bonus:1,desc:'所有事件檢定 +1',cond:p=>p.wins>=12&&p.trust>=70}];function titleBonus(c){if(!current||!current.titles)return 0;var type=eventType(c),b=0;current.titles.forEach(id=>{var t=titleDefs.find(x=>x.id===id);if(t&&(t.types.includes('ALL')||t.types.includes(type)))b+=t.bonus});return clamp(b,0,3)}function titleNamesFor(c){if(!current||!current.titles)return[];var type=eventType(c);return current.titles.map(id=>titleDefs.find(x=>x.id===id)).filter(t=>t&&(t.types.includes('ALL')||t.types.includes(type))).map(t=>t.name)}function successChance(v,dc,tb){var bonus=abilityBonus(v)+(tb||0),target=checkTarget(dc),ok=0;for(var r=1;r<=20;r++)if(r===20||(r!==1&&r+bonus>=target))ok++;return ok*5}function checkTitles(){if(!current)return;current.titles=current.titles||[];titleDefs.forEach(t=>{if(!current.titles.includes(t.id)&&t.cond(current)){current.titles.push(t.id);addLog('🏅 獲得稱號【'+t.name+'】｜'+t.desc)}});renderTitles()}function renderTitles(){if(!E('titles'))return;if(!current||!current.titles||!current.titles.length){E('titles').innerHTML='<span class="noTitle">尚未取得稱號</span>';return}E('titles').innerHTML=current.titles.map(id=>{var t=titleDefs.find(x=>x.id===id);return'<span class="titleChip" title="'+t.desc+'">【'+t.name+'】</span>'}).join('')}function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(34,48);Object.keys(names).forEach(k=>p.skills[k]=clamp(base+ri(-8,9),22,58));p.skills.touch+=Math.round((p.height-195)/8);p.skills.dunk+=Math.round((p.height-195)/5);p.skills.intdef+=Math.round((p.height-195)/5);p.skills.block+=Math.round((p.wingspan-p.height)/4);p.skills.dreb+=Math.round((p.wingspan-p.height)/5);p.skills.strength+=Math.round((p.weight-88)/7);if(p.height>208){p.skills.handle-=Math.round((p.height-208)/5);p.skills.accel-=Math.round((p.height-208)/6)}Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],20,62));roster.push(JSON.parse(JSON.stringify(p)));renderRoster();startCareer(p)}function renderRoster(){E('players').innerHTML=roster.map((p,i)=>'<div class="player"><b>'+p.name+'</b><div class="small">#'+(i+1)+'｜'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜初始 OVR '+ovr(p)+'</div></div>').join('')||'<div class="small">尚未創建球員。</div>'}function startCareer(p){current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.level='hbl';current.phase=0;current.pool=0;current.trust=45;current.scout=0;current.wins=0;current.titles=[];current.log=[];current.eventOrder={};rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');prepareYear();addLog('🏁 '+current.name+' 的 HBL 生涯開始。');renderPhase()}function backHome(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster();scrollTo(0,0)}function year(){if(current.level==='college')return'大'+['一','二','三','四'][current.collegeYear-1];return current.grade===1?'高一':current.grade===2?'高二':'高三'}function keyYear(){return(current.level==='college'?'c'+current.collegeYear:'h'+current.grade)}function prepareYear(){var arr=[0,1,2,3,4];for(var i=4;i>0;i--){var j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}current.eventOrder[keyYear()]=arr}function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function renderAll(){E('stage').textContent=current.level==='college'?current.college.short+' '+year():'HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('trust').textContent=current.trust;E('scout').textContent=current.scout;E('wins').textContent=current.wins;E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>';renderTitles();renderProgress();renderTabs();renderAttrs()}function renderProgress(){E('progress').innerHTML=phases().map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}function renderAttrs(){if(!current)return;var can=current.phase===2;E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return'<div class="attr"><div class="attrTop"><span>'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;addLog('📈 '+names[k]+' → '+current.skills[k]);checkTitles();renderAll()}function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('offers').innerHTML='';E('offers').classList.add('hidden');E('result').className='result hidden';E('continueBtn').classList.add('hidden');E('continueBtn').textContent='繼續'}function d20html(n){return'<div class="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 92,28 82,78 50,97 18,78 8,28" fill="#b86b08" stroke="#ffd18a" stroke-width="2"/><polygon points="50,3 50,50 8,28" fill="#7f4705"/><polygon points="50,3 92,28 50,50" fill="#d18411"/><polygon points="8,28 50,50 18,78" fill="#a35d08"/><polygon points="92,28 82,78 50,50" fill="#915006"/><polygon points="18,78 50,50 50,97" fill="#c3730b"/></svg><div class="num">'+n+'</div></div>'}function ev(title,text,choices,score,clock){return{title,text,choices,score,clock}}function ch(t,d,keys,dc,s,f){return{t,d,keys,dc,s,f}}var hblIntros={1:['第一天，你的名字在名單最下面','報到那天，球館裡已經有人練完一輪。三年級主力坐在場邊綁鞋帶，二年級球員大聲喊著戰術名稱，而你連自己的置物櫃在哪裡都還不知道。\n\n國中時的得分、獎盃、先發紀錄，都沒有跟著你一起進高中。隊內對抗第一個回合，你被學長的身體碰撞直接撞出底線。教練沒吹犯規，只對助教說：「先看看他會不會怕。」\n\n高一不是成名的一年。至少現在不是。你得先證明自己值得進入十二人名單。'],2:['第二年，沒有人再把你當新人','暑假結束後，你走進同一座球館，卻發現自己的位置變了。去年你坐過的板凳末端，現在坐著新的高一生；而教練第一次在戰術講解時，直接點名問你的意見。\n\n這並不代表先發已經屬於你。隊上同位置的學長還在，新生中也有人身體條件比你更好。你不再能用「還年輕」解釋失誤。\n\n高二真正的問題是：你只是可靠的輪替，還是能讓球隊圍繞你做更多事情？'],3:['最後一年，每一場都開始有倒數感','高三第一天，學弟叫你「學長」時，你愣了一下。牆上的新賽程從資格賽一路排到決賽，你卻很清楚，無論走到哪一天，這張表的最後一格都代表你的高中籃球結束。\n\n大學教練、海外球探、隊友的期待與自己的未來同時壓了上來。有人希望你帶隊，有人只看你的數據，也有人已經開始問你畢業後要去哪裡。\n\n高三不只是最後一次拚 HBL，也是第一次真正為下一個層級打球。']};var hblEvents={1:[ev('第一次被叫上場','第二節剩下 4 分多鐘，你原本以為今天只會坐在板凳學習。教練卻突然轉身喊你的名字，沒有交代長篇戰術，只說：「先守住，不要送分。」\n\n你走向紀錄台時才發現手心都是汗。對方後衛一看到換上的是一年級，第一個回合就揮手叫隊友拉開。場上的學長看了你一眼，沒有過來幫忙。\n\n這不是精彩集錦的機會，而是你第一次回答教練：你能不能留在場上？',[ch('先把防守做到零失誤','不搶表現，專注站位、換防與不犯規。',['perdef','defiq'],11,'你連續兩個回合逼對手出手困難球。下一個死球時，教練沒有換你下場。','你被假動作點起，接著又漏掉底角。教練馬上叫人到紀錄台。'),ch('拿到第一球就主動進攻','希望用進球讓隊友與教練立刻記住你。',['handle','layup','speed'],13,'你抓住轉換機會完成第一次高中得分，板凳瞬間有人站起來大喊。','你太急著證明自己，突破時球被碰掉，回防還來不及。')],'18：24','第二節 4:12'),ev('學長開始測試你','隊內五打五連續三天，三年級前鋒每次換防到你面前都刻意加重碰撞。第一次你退了一步，第二次直接被頂到失位。\n\n第三次，他在發球前低聲說：「國中那套在這裡沒用。」周圍沒有人替你說話。這更像一種球隊內默認的測試。\n\n你得決定用什麼方式告訴他，你不是可以隨便處理的新人。',[ch('正面把碰撞扛回去','接受身體對抗，用力量和體能撐住。',['strength','stamina'],13,'這次你沒有退，還在接觸後把球放進。學長拍了一下你的背。','你想硬碰硬，卻失去重心。教練提醒你不要只靠情緒。'),ch('用速度與節奏避開他','不跟強項硬碰，改用變速和腳步。',['accel','handle','offiq'],11,'你連續兩次用節奏過掉第一步，逼他只能伸手犯規。','他提前卡住你的路線，你整個回合都沒進入攻擊位置。')]),ev('十二人名單只剩最後一格','資格賽前一週，助教把十二人名單寫在白板上，最後一格故意空著。你和另一名一年級的名字被寫在旁邊。\n\n最後兩場隊內賽會決定誰穿球衣、誰坐看台。對方是穩定型球員，很少失誤；你的優勢是上限看起來更高，但波動也更大。\n\n比賽前，助教問你：「你今天想讓教練看到什麼？」',[ch('把進攻天賦全部亮出來','增加出手與持球，搶一個讓人記得的回合。',['three','layup','offiq'],13,'你打出全隊最高效率，空著的名字最後填上了你。','你連續做出勉強選擇，競爭者靠穩定表現拿走名額。'),ch('不搶球權，把髒活做到極致','防守、卡位、補位與無球跑動都不放掉。',['perdef','dreb','offball'],11,'教練整場幾乎沒稱讚你，但名單公布時你的名字在上面。','你太低調，教練最後認為另一人更適合短輪替。')]),ev('最後 8.4 秒，球真的到了你手上','第四節剩 8.4 秒，你們落後兩分。原本設計給學長的戰術在發球前被對手看穿，教練臨時把戰術板擦掉。\n\n他看向你，又看了一眼對方剛換上的最佳防守者：「如果第一個接球點被封，球就給你。你自己讀。」\n\n哨聲響起後，第一選擇果然被鎖死。球傳到你手裡，全場突然安靜得像只剩鞋底摩擦聲。',[ch('切入製造 2+1','攻擊防守者前腳，強行打進禁區。',['layup','foulDraw','strength'],13,'你扛住碰撞把球擦板放進，裁判哨聲幾乎同時響起。','協防準時到位，你沒有得到哨音，球在干擾下偏出。'),ch('運一步後強拔三分','選擇最冒險、但能直接反超的方式。',['three','handle'],15,'球越過防守者指尖後乾淨穿網，板凳席整排衝了進來。','出手角度夠了，但球砸在後框彈出，時間也跟著歸零。'),ch('突破吸引協防再分球','相信閱讀比英雄球更重要。',['handle','pass','vision'],12,'兩名防守者都被你吸走，底角隊友獲得完全空檔。','你多等了半拍，防守者讀到傳球路線直接抄走。')],'68：70','8.4 秒'),ev('八強賽前一晚睡不著','旅館熄燈後，房間裡只剩冷氣聲。明天輸球，高一球季就會結束。你腦中反覆想著最近投丟的幾球、教練可能安排的對位，以及自己會不會在最重要的時候犯錯。\n\n你摸到床邊的手機，看到隊友群組有人說要去飯店的小健身房再投幾顆；另一邊的學長早就戴上眼罩睡了。\n\n你明白準備和焦慮有時只差一條線。',[ch('再去加練半小時','用熟悉的動作讓腦袋安靜下來。',['stamina','three','ft'],12,'最後十顆罰球全進，你帶著穩定感回房睡著。','你練過頭，隔天熱身時雙腿比預期沉。'),ch('關掉手機，強迫自己休息','相信已經做過的準備。',['offiq','stamina'],10,'呼吸慢慢穩定，你第二天醒來精神完整。','你躺了很久還是沒睡著，腦袋一直轉。')])],2:[],3:[]};hblEvents[2]=[ev('先發位置第一次真正空出來','畢業學長離隊後，先發名單空出一格。教練沒有直接把位置給你，而是讓你和另一名二年級在季前賽輪流先發。\n\n你們的風格不同：他穩、幾乎不犯錯；你能做更多事，但也更容易把比賽打複雜。最後一場測試賽前，教練只說：「我要能幫球隊贏的人，不是數據最好看的人。」',[ch('主動接管進攻','提高球權，證明自己能承擔主力責任。',['handle','mid','offiq'],13,'你不只得分，還控制了整段進攻節奏，先發背心最後落到你手上。','你太想證明自己，連續幾次選擇都變得勉強。'),ch('用全面表現贏下位置','得分之外，把防守、籃板與傳球都補上。',['defiq','pass','dreb'],11,'你沒有拿最多分，但在場上時球隊明顯更穩。','你什麼都做了一些，卻沒有一項真正改變比賽。')]),ev('主控受傷，教練把球塞給你','練習結束後，教練把你留下。原本的主控腳踝受傷，至少缺席兩週。戰術板上你的名字被移到持球點旁邊。\n\n「你不是控衛，但接下來要像控衛一樣想事情。」這代表更多球權，也代表每一次失誤都會被放大。\n\n你有機會讓自己的角色直接升級，也可能暴露自己還沒準備好的部分。',[ch('接受主要持球任務','把這次意外當成角色升級機會。',['handle','pass','vision'],12,'你很快適應擋拆與節奏控制，教練之後仍保留部分持球權給你。','連續失誤讓教練不得不把組織責任拆給其他人。'),ch('維持原本打法','告訴教練自己更適合終結而不是組織。',['offiq','offball'],10,'你保持原本效率，也避免球隊因角色錯置更混亂。','教練接受安排，但你也錯過一次擴大技能包的機會。')]),ev('新來的高一學弟把你當成目標','一名高一新生從第一天就明說最想取代你的位置。對抗賽裡他每次得分都看向你，甚至在隊友面前說：「明年這位置就是我的。」\n\n去年的你可能會把這當挑釁；現在你第一次站在學長的位置。更衣室裡其他人都在看你怎麼處理。',[ch('在對抗賽正面壓制他','用場上表現建立順位。',['perdef','handle','strength'],12,'你用成熟度連續處理他幾個回合，之後他不再只靠嘴巴挑戰。','你被激怒後打得太急，反而讓學弟抓到幾個精彩回合。'),ch('把他拉到旁邊談','不否定競爭，但把界線說清楚。',['pass','offiq','defiq'],10,'學弟仍想搶位置，但開始尊重你，也更願意聽戰術提醒。','談話沒有真正改變他的態度，隊內張力繼續存在。')]),ev('對手用全場包夾逼你交球','第四節剩 42 秒，你們只領先一分。對手暫停後直接改成全場雙人壓迫，第一個目標就是不讓你舒服帶球過半場。\n\n第一名防守者貼住你的強側，第二個人從中線往回壓。教練沒有叫暫停，他站在場邊雙手抱胸。\n\n這不是最後一球，卻可能是決定勝負的一個失誤。',[ch('靠控球和速度硬闖','相信自己的運球能突破兩人。',['handle','accel','speed'],13,'你用一次背後換手穿過夾擊，全場爆出驚呼。','第二名防守者從側邊碰掉球，對手直接獲得反快攻。'),ch('提前長傳破解','在包夾完全形成前找前場隊友。',['pass','vision','offiq'],12,'球越過第一線直接形成二打一，對方被迫撤掉包夾。','你出手太急，球直接飛出界外。'),ch('護球等隊友回接','選最穩的處理，但要和八秒計時賽跑。',['strength','handle','offiq'],11,'你用身體保護球，等到隊友回接成功過半場。','隊友回來得太慢，裁判吹響八秒違例。')],'61：60','42 秒'),ev('淘汰賽，教練把對方王牌交給你','對方王牌第三節末連拿 9 分，原本的防守者已經被打到不敢貼身。死球時教練朝你勾手，指了指記分板，又指向對方 7 號。\n\n「接下來他得幾分，就算你的。」這句話很不公平，但你知道那其實是一種信任。\n\n下一回合，7 號在弧頂慢慢拍球，全場都知道他會單打。',[ch('貼身壓迫，不給舒服節奏','把身體接觸拉到最高。',['perdef','strength','defiq'],13,'你把他逼到底線，最後只能投出失衡後仰。','他利用你貼得太近，一個變向就過掉第一線。'),ch('放半步誘導到弱側','用判斷把他導向協防。',['perdef','defiq','speed'],12,'他照你預想的方向切入，協防準時關門。','他看穿你的站位，直接急停跳投命中。'),ch('直接賭抄截','高風險地搶第一拍。',['steal','speed'],15,'你精準拍掉球，直接帶起反快攻。','你撲空一步，身後完全沒有人保護。')],'74：74','1:12')];hblEvents[3]=[ev('隊長責任不只是跳球前握手','季前會議最後，教練把隊長袖標放在你面前。你原本以為隊長只是代表資格，直到第一週就有學弟遲到、主力和助教吵架、兩名隊友因球權冷戰。\n\n教練沒有替你處理，只說：「你想帶隊，就先處理人。」你第一次發現，領導力可能消耗的不是體能，而是注意力。',[ch('接下所有溝通責任','主動當球員與教練之間的橋樑。',['offiq','defiq','stamina'],12,'隊內問題沒有消失，但大家開始願意先找你談。','你把太多事情扛在身上，連自己的訓練都開始受影響。'),ch('把界線畫清楚，只管球場','不讓額外責任拖垮自己。',['offiq','stamina'],10,'你保持競技狀態，隊友也逐漸理解你的領導方式。','幾名隊友覺得你在需要站出來時選擇沉默。')]),ev('看台上的人開始不是來看比賽而已','熱身時助教靠過來，小聲說今天有幾個大學教練和海外球探。你回頭看，看台那幾個人沒有穿校服，也沒有為任何一隊加油，只是不停記筆記。\n\n從那一刻開始，每次失誤都像被放大。你甚至開始想：一次糟糕的出手會不會讓某個機會直接消失？\n\n比賽還沒開始，你得先決定自己要不要因為他們改變打法。',[ch('刻意展現全面能力','主動持球、傳球、防守，讓球探看到更多。',['pass','perdef','handle'],13,'你沒有刷高分，但球探的筆記從第一節寫到第四節。','你想證明太多東西，反而失去平常的進攻節奏。'),ch('完全照平常方式打','不為看台改變任何選擇。',['offiq','stamina'],10,'你打出穩定而真實的比賽，球探得到清楚的評估。','你嘴上說不在意，實際上幾次出手都明顯僵硬。')]),ev('腳踝在八強賽前亮起警訊','熱身落地時右腳踝突然刺了一下。隊醫重新檢查後說沒有明顯結構傷，但腫脹比早上嚴重。如果照正常時間打，惡化風險不低。\n\n這是你最後一屆 HBL。更殘酷的是，今天看台上還坐著幾個大學教練。你知道「帶傷上場」可以被寫成英雄故事，也可能變成幾個月的復健。',[ch('照常出賽，不減時間','接受風險，不想留下遺憾。',['stamina','strength'],14,'你撐完整場，腳踝沒有進一步惡化，關鍵時間仍在場上。','第三節一次落地讓傷勢加重，你後半場幾乎失去爆發力。'),ch('限制上場時間','只把自己留給真正關鍵的回合。',['offiq','stamina'],11,'你用有限時間維持效率，也保住後續賽事。','節奏被切得太碎，你整場都沒有真正進入狀態。')]),ev('最後一場高中主場','賽前介紹時，觀眾席第一次有人舉著寫你名字的海報。你看到父母、以前的國中教練，也看到那些一路坐同一區的同學。\n\n當廣播念到你的名字，你突然意識到：不管之後去哪裡，這可能是最後一次在這座球館穿高中球衣。情緒很滿，但比賽不會因此變簡單。',[ch('開場就主動攻擊','用侵略性把整座球館點燃。',['layup','three','offiq'],13,'你的第一球就命中，球隊跟著進入高昂節奏。','你開場太想留下畫面，連續兩次出手都變得勉強。'),ch('先讓隊友全部進入比賽','從傳球、防守和溝通開始。',['pass','vision','defiq'],11,'全隊很快找到節奏，你成為把每個人串起來的核心。','你過度無私，球隊反而少了最需要的主要攻擊點。')]),ev('HBL 最後一戰，11.2 秒','比分 72：72。這次沒有人需要提醒你：如果輸了，高中生涯就真的結束。\n\n暫停時教練本來畫了戰術，畫到一半卻停下來，把筆放在戰術板上。「三年了。」他看著你說，「最後一次，你自己決定。」\n\n回到場上，對方最好的防守者站在你面前。你有足夠時間做一個選擇，卻沒有時間後悔。',[ch('壓時間後急停中距離','用節奏創造最熟悉的出手。',['handle','mid','offiq'],13,'球在蜂鳴器前落網，你被隊友直接撲倒在地板上。','球短了一點，碰到前框彈出，蜂鳴器接著響起。'),ch('全力殺進籃下','把最後一球交給衝擊力與哨音。',['layup','foulDraw','explosion'],13,'你在碰撞中把球送進籃框，裁判同時響哨。','協防準時補到，你的上籃被封在籃板上。'),ch('吸引包夾後找隊友','相信這三年建立的隊友關係。',['handle','pass','vision'],12,'兩名防守者都被你吸走，隊友得到完全空檔。','包夾來得比預期慢，你的傳球失去角度。')],'72：72','11.2 秒')];function rewardFor(c,e){var pts=c.dc>=15?3:c.dc>=13? baElite',country:'台灣',name:'UBA 一級強權',short:'UBA 強權',diff:1,ok:p=>ovr(p)>=53&&p.trust>=58},{id:'japan',country:'日本',name:'日本大學一級聯賽',short:'日本大學',diff:1,ok:p=>ovr(p)>=54&&p.scout>=10},{id:'korea',country:'韓國',name:'韓國大學聯賽',short:'韓國大學',diff:2,ok:p=>ovr(p)>=55&&p.scout>=14},{id:'philippines',country:'菲律賓',name:'菲律賓大學頂級聯賽',short:'菲律賓大學',diff:2,ok:p=>ovr(p)>=54&&p.scout>=15},{id:'d2',country:'美國',name:'NCAA Division II',short:'NCAA D2',diff:2,ok:p=>ovr(p)>=58&&p.scout>=20&&p.wins>=8},{id:'d1',country:'美國',name:'NCAA Division I',short:'NCAA D1',diff:3,ok:p=>ovr(p)>=64&&p.scout>=28&&p.wins>=10&&Math.max(...Object.values(p.skills))>=72}];function showCollegeOffers(){resetStory();current.level='offers';E('stage').textContent='升學招募';E('progress').innerHTML='';E('eyebrow').textContent='RECRUITING';E('storyTitle').textContent='三年 HBL 後，哪些學校真的願意給你位置？';E('storyText').textContent='球季結束後的幾週，你的手機開始收到不同來源的訊息。有些只是詢問，有些是正式邀約，也有曾經關注你的人最後沒有再聯絡。\n\n邀約不是按照一個 OVR 排名自動發送。球探關注、教練評價、三年事件表現，以及你是否已經形成足以跨級別競爭的強項，都會影響選項。\n\n下面只顯示目前真正達到條件的路線。';var list=collegeRoutes.filter(x=>x.ok(current));if(!list.length)list=[{id:'walkon',country:'台灣',name:'大專校隊試訓',short:'大專試訓',diff:0}];E('offers').classList.remove('hidden');E('offers').innerHTML=list.map(x=>'<button class="offer" onclick="chooseCollege(\''+x.id+'\')"><span class="country">'+x.country+'</span><span class="offerName">'+x.name+'</span><span>這是目前依照你的高中履歷真正出現的選項。</span></button>').join('')}function chooseCollege(id){var r=id==='walkon'?{id:'walkon',country:'台灣',name:'大專校隊試訓',short:'大專試訓',diff:0}:collegeRoutes.find(x=>x.id===id);current.level='college';current.college=r;current.collegeYear=1;current.phase=0;current.trust=Math.max(38,Math.round(current.trust*.75));current.wins=0;prepareYear();addLog('🎓 接受 '+r.name+'，進入大一。');renderPhase()}function collegeIntro(){var y=current.collegeYear,n=current.college.name;if(y===1)return{title:'高中履歷在這裡只能換到一次自我介紹',text:'第一次走進 '+n+' 的球館時，你很快發現所有新生都有自己的故事。有人是當地高中明星，有人代表過青年國家隊，也有人身材條件好到站著就吸引教練目光。\n\n你的 HBL 經歷讓大家知道你是誰，卻不能替你守住任何一分鐘上場時間。第一次分組時，你被排進第二隊，主力組甚至沒有和你對位。\n\n大一真正的第一關不是職業、不是冠軍，而是讓教練在正式比賽需要換人時想到你的名字。'};if(y===2)return{title:'你已經有位置，但位置開始有人來搶',text:'一年後，你熟悉戰術、重量訓練與比賽節奏，甚至開始知道教練什麼時候會生氣。但新一屆新生報到時，你看到一個和你同位置、身材更好的球員。\n\n去年你是挑戰者，今年第一次有人把你當成要被取代的對象。教練沒有承諾任何順位，只說新球季重新競爭。\n\n大二決定的是，你能不能從「可以用」變成「必須用」。'};if(y===3)return{title:'大三，球探不再只看潛力',text:'以前球探問的是你還能長成什麼樣；到了大三，他們開始問你現在到底能做什麼。比賽影片被剪成片段，效率、對位、失誤與弱點開始被逐項記錄。\n\n你可能仍然有成長空間，但職業世界不會等到所有缺點都修完才評估你。\n\n這一年，每一場高曝光比賽都可能讓你的下一條路突然變寬，也可能讓原本的想像變得現實。'};return{title:'大四：最後一次可以把「還年輕」當理由',text:'球隊拍定裝照時，攝影師要大四球員站到最前面。你突然想起高一第一次拍 HBL 球衣時，自己站在最後一排。\n\n現在學弟問你職業隊試訓、經紀人與海外聯賽的事情，彷彿你已經知道答案。事實上，你自己也還在等。\n\n最後一季不只關於大學冠軍。它會決定你畢業後還能不能繼續把籃球當成工作。'}}function collegeEvents(){var d=current.college.diff||0,y=current.collegeYear;return[ev('輪替表上，你的名字仍在邊緣','教練公布第一版輪替時，你排在主要替補之外。這不代表整季沒有機會，但每一次練習都必須讓教練重新考慮。\n\n主力組已有固定默契，直接搶球權只會讓自己更像新人。你得選擇用哪種方式進入教練視線。',[ch('先靠防守取得信任','從最不需要球權的工作開始。',['perdef','defiq','stamina'],11+d,'你連續幾天在對抗賽守住主力，名字被往前挪了一格。','你的防守仍跟不上大學節奏，教練暫時沒有改變順位。'),ch('直接展示進攻上限','用得分能力迫使教練注意。',['handle','three','layup'],13+d,'你在對抗賽連續打進高難度回合，教練開始安排你進主力組測試。','你出手太急，隊友開始不願意在第二隊把球交給你。')]),ev('第一次連續三場打不好','大學賽季第一次遇到真正低潮。三場比賽你的命中率都不好，上一場最後甚至被教練直接按在板凳。\n\n社群上開始有人問你是不是被高估，隊友沒有說什麼，但你感覺到自己接球時比以前更猶豫。',[ch('繼續照原本方式出手','相信樣本會回歸，不因低潮改打法。',['offiq','stamina','mid'],12+d,'你沒有逃避空檔，下一場手感終於回來。','低潮繼續延長，你的信心開始被真正影響。'),ch('先從防守與傳球重建節奏','暫時降低得分壓力。',['defiq','pass','offball'],10+d,'你用其他方式重新留在場上，進攻也慢慢回穩。','你變得太保守，反而讓對手完全不再尊重你的進攻。')]),ev('全國舞台的關鍵兩分鐘','淘汰賽最後兩分鐘，比分只差一球。教練原本安排主力打完，卻因一名隊友犯滿把你叫上場。\n\n你坐了大半節，手是冷的；但對手不會因為你剛上場就降低強度。這兩分鐘可能比前面二十分鐘更容易被記住。',[ch('主動要求球權','相信自己能在冷手狀態直接解決。',['handle','three','mid'],13+d,'你連續完成兩個關鍵進攻，賽後畫面反覆播放。','你第一球就投短，第二次突破又被協防封住。'),ch('先做正確閱讀','不追英雄球，找最好的進攻。',['pass','vision','offiq'],11+d,'你連續做出正確傳球，最後一次助攻直接決定勝負。','你太怕犯錯，錯過一個本來應該自己出手的機會。')],'77：76','1:48'),ev('球探第一次直接和教練談你的名字','訓練後你看到陌生人和教練在場邊談了很久。助教後來告訴你，那是來看球員的球探，而且對方問了你的角色、訓練態度與下一步規劃。\n\n這不是合約，也不是保證，但第一次有人把你的名字放進職業層級的討論裡。',[ch('刻意擴大技能包','接下更多持球與組織，證明自己不是單一功能球員。',['handle','pass','offiq'],12+d,'你的全面性讓球探留下更完整的評價。','你為了展示能力做了太多不熟悉的事，效率下降。'),ch('把最強武器做到極致','不改角色，讓自己的招牌能力更難被忽略。',[bestSkillKey(),'offiq'],11+d,'你的強項變成對手賽前報告一定會圈出的項目。','對手開始針對單一強項，其他能力暫時沒能解圍。')]),ev(y===4?'大學生涯最後一場':'球季最後一場決定下一年的順位',y===4?'終場前，你站在罰球線附近看向觀眾席。四年裡你從第二隊、板凳、輪替一路走到今天。無論接下來有沒有職業合約，這都是最後一次以大學生身分打正式比賽。\n\n比賽仍然只差一球。感傷可以留到終場後，現在還有一個回合。':'球季最後一戰不一定決定冠軍，卻會成為教練規劃下學年角色的重要參考。你知道休賽季會有人畢業、有人轉入，也會有新生報到。\n\n最後幾分鐘，教練把你留在場上。這是一個很清楚的訊號：他想看看你怎麼處理真正需要負責的時刻。',[ch('自己完成關鍵回合','把球留在自己手上。',['handle','layup','offiq'],12+d,'你完成關鍵進攻，這個球季用最有份量的方式結束。','對手守住你的第一選擇，出手最終偏出。'),ch('用閱讀找到最好機會','不預設誰出手，只追求最好的結果。',['pass','vision','offiq'],11+d,'你吸引防守後送出關鍵助攻，隊友第一時間衝過來抱住你。','你多傳了一次，最後的機會在輪轉中消失。')],'81：80','24 秒')]}function bestSkillKey(){return Object.keys(current.skills).sort((a,b)=>current.skills[b]-current.skills[a])[0]}function seasonSummary(){resetStory();checkTitles();renderAll();E('eyebrow').textContent='SEASON END';E('storyTitle').textContent=year()+'賽季結束';var rating=ovr(current)+Math.floor((current.trust-45)/10)-(current.level==='college'?(current.college.diff||0)*2:0);var p=Math.max(2,Math.round((rating-28)*.34)),rb=Math.max(1,Math.round((current.skills.dreb+current.skills.oreb-55)/18)),a=Math.max(1,Math.round((current.skills.pass+current.skills.vision-55)/18));E('storyText').textContent='漫長的球季終於停下來。數據不會完整記錄你經歷的每一個回合，但它會留下目前最直接的結果。\n\n場均 '+p+' 分｜'+rb+' 籃板｜'+a+' 助攻\n教練信任 '+current.trust+'｜球探關注 '+current.scout+'｜目前 OVR '+ovr(current)+'\n\n你已取得 '+current.titles.length+' 個稱號。能力特色與稱號都會跟著你進入下一個階段。';if(current.level==='college')E('continueBtn').textContent=current.collegeYear<4?'進入下一學年':'完成大學生涯';else E('continueBtn').textContent=current.grade<3?'進入下一學年':'查看大學邀約';E('continueBtn').classList.remove('hidden')}function advance(){if(current.level==='offers')return;if(current.phase<8){current.phase++;renderPhase();return}if(current.level==='hbl'){if(current.grade<3){current.grade++;current.phase=0;prepareYear();addLog('📅 進入 HBL '+year());renderPhase()}else showCollegeOffers();return}if(current.level==='college'){if(current.collegeYear<4){current.collegeYear++;current.phase=0;current.trust=Math.max(35,current.trust-4);prepareYear();addLog('📅 進入 '+current.college.short+' '+year());renderPhase()}else{resetStory();E('eyebrow').textContent='COLLEGE COMPLETE';E('storyTitle').textContent='大學生涯結束';E('storyText').textContent='四年的大學籃球正式結束。接下來才是職業選秀、簽約、旅外與國家隊真正開始分岔的地方。';E('progress').innerHTML=''}}}</script></body></html>
