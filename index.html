<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basketball Life Prototype v0.8</title>
<style>
:root{--bg:#090d12;--panel:#141b25;--panel2:#0f151d;--line:#283444;--txt:#f3f6fa;--muted:#98a5b5;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--purple:#c084fc;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b10,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.topbar{margin-bottom:18px}.topbar h1{margin:0;font-size:29px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.card{background:rgba(20,27,37,.97);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 35px rgba(0,0,0,.18)}.setup{display:grid;grid-template-columns:400px 1fr;gap:18px}@media(max-width:860px){.setup{grid-template-columns:1fr}}h2{margin:0 0 13px;font-size:18px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}input,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#1a1204;border:0}.secondary{background:#202a38}.ghost{background:#111923}.note{font-size:13px;line-height:1.7;color:#c7d0db;background:#101723;border-left:3px solid var(--orange);padding:11px;border-radius:9px;margin-bottom:13px}.hidden{display:none!important}.players{display:grid;gap:12px}.player{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.playerhead{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:900}.small{font-size:12px;color:var(--muted)}.score{font-size:24px;font-weight:900;color:var(--orange)}.career{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}@media(max-width:900px){.career{grid-template-columns:1fr}}.side{position:sticky;top:12px}@media(max-width:900px){.side{position:static}}.stageTitle{font-size:24px;font-weight:900;margin-bottom:4px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;padding:6px 9px;border-radius:999px;background:#202a38;border:1px solid var(--line)}.ovr{font-size:44px;font-weight:900;margin:8px 0}.miniStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.mini{background:#0e141c;border:1px solid var(--line);border-radius:11px;padding:9px}.mini b{display:block;font-size:18px}.progress{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#111923;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a;border-color:#6f4b0d}.step.done{color:var(--green)}.storyCard{min-height:420px}.eyebrow{font-size:12px;color:var(--blue);font-weight:800;margin-bottom:7px}.storyTitle{font-size:25px;font-weight:900;margin-bottom:12px}.story{font-size:16px;line-height:1.95;color:#e7ecf2;white-space:pre-line}.choices{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}.choice{text-align:left;background:#121b27;padding:15px;border:1px solid #314158}.choice strong{display:block;font-size:15px}.choice span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.6}.diceRow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.die{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-size:28px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.25)}.result{margin-top:16px;background:#0f151e;border:1px solid var(--line);border-radius:13px;padding:14px;line-height:1.75}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}.stat{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:19px}.log{max-height:260px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:12px}.log p{margin:0 0 9px;line-height:1.55}.blue{color:var(--blue);font-weight:800}.green{color:var(--green);font-weight:800}.purple{color:var(--purple);font-weight:800}.red{color:var(--red);font-weight:800}.badge{display:inline-block;padding:3px 7px;border-radius:7px;background:#222d3b;margin-right:4px}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
</style></head>
<body><div class="wrap">
<div class="topbar"><h1>🏀 Basketball Life <span class="small">v0.8</span></h1><div class="sub">HBL 測試版｜不再一鍵吃完整季，改成多階段故事與選擇</div></div>

<div id="setup" class="setup">
<div>
<div class="card"><h2>① 球員基本資料</h2><div class="note">所有球員固定從 HBL 高一開始。球員本體與事件 Seed 完全分開。</div>
<div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div>
<div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div>
<div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div>
<div class="row"><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div><div><label>打法傾向</label><select id="style"><option value="balanced">自由 / 均衡</option><option value="handler">持球核心</option><option value="shooter">投射型</option><option value="defender">防守型</option><option value="big">長人核心</option></select></div></div>
<button class="primary" onclick="generatePlayer()">生成球員</button></div>
<div class="card" style="margin-top:18px"><h2>② 事件 Seed</h2><div class="note">Seed 只決定事件抽取、事件順序與事件骰結果，不改變你生成的球員能力。</div><input id="seed" value="THREADS-2026"></div>
</div>
<div class="card"><h2>③ 生成過的球員</h2><div id="players" class="players"><div class="small">尚未生成球員。</div></div></div>
</div>

<div id="career" class="career hidden">
<aside class="side">
<div class="card"><div id="stage" class="stageTitle">HBL 高一</div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:14px">OVR</div><div id="ovr" class="ovr">--</div><div class="miniStats"><div class="mini"><span class="small">教練信任</span><b id="trust">50</b></div><div class="mini"><span class="small">信心</span><b id="confidence">50</b></div><div class="mini"><span class="small">健康</span><b id="health">100</b></div><div class="mini"><span class="small">球探關注</span><b id="scout">0</b></div></div></div>
<div class="card" style="margin-top:14px"><h2>能力</h2><div id="stats" class="stats"></div></div>
</aside>
<main>
<div id="progress" class="progress"></div>
<div class="card storyCard"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:14px" onclick="advancePhase()">繼續</button></div>
<div class="card" style="margin-top:18px"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:10px" onclick="backSetup()">← 回首頁</button></div>
</main></div>

<script>
var roster=[],current=null,idSeq=1,rng=Math.random;
var skillNames={finish:'終結',mid:'中距離',three:'三分',ft:'罰球',handle:'控球',pass:'傳球',defense:'外線防守',interior:'內線防守',rebound:'籃板',speed:'速度',strength:'力量',iq:'籃球IQ'};
var phases=['季前故事','季初特訓','一般事件','特殊事件','健康管理','賽季結算','季末成長','生涯抉擇'];
function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d100(){return Math.floor(rng()*100)+1}function dr(n){return Math.floor(rng()*n)}
function ovr(p){var s=p.skills;return Math.round(avg([s.finish,s.mid,s.three,s.handle,s.pass,s.defense,s.interior,s.rebound,s.speed,s.strength,s.iq]))}function type(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=78&&s.three>=78&&s.interior>=78)return'獨角獸';if(h>=205&&s.pass>=82&&s.iq>=82&&s.rebound>=74)return'全能組織長人';if(h>=198&&s.handle>=82&&s.pass>=80)return'控球前鋒';if(s.three>=82&&s.defense>=80)return'3&D';if(s.pass>=86&&s.handle>=84)return'進攻發動機';if(s.interior>=86&&s.rebound>=84)return'護框中樞';return'多功能球員'}
function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,style:E('style').value,grade:1,age:16,skills:{}};var base=ri(48,66),k;for(k in skillNames)p.skills[k]=clamp(base+ri(-8,11),30,86);if(p.style==='handler'){p.skills.handle+=10;p.skills.pass+=8;p.skills.iq+=5}if(p.style==='shooter'){p.skills.three+=11;p.skills.mid+=7;p.skills.ft+=5}if(p.style==='defender'){p.skills.defense+=10;p.skills.interior+=6;p.skills.rebound+=4}if(p.style==='big'){p.skills.interior+=11;p.skills.rebound+=9;p.skills.pass+=4}p.skills.interior+=Math.round((p.height-195)/3);p.skills.rebound+=Math.round((p.wingspan-p.height)/3);p.skills.strength+=Math.round((p.weight-90)/5);if(p.height>208)p.skills.handle-=Math.round((p.height-208)/4);for(k in p.skills)p.skills[k]=clamp(p.skills[k],25,94);roster.push(p);renderRoster()}
function renderRoster(){if(!roster.length){E('players').innerHTML='<div class="small">尚未生成球員。</div>';return}var h='';for(var i=0;i<roster.length;i++){var p=roster[i];h+='<div class="player"><div class="playerhead"><div><div class="name">'+p.name+'</div><div class="small">'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜臂展 '+p.wingspan+'cm｜'+type(p)+'</div></div><div class="score">'+ovr(p)+'</div></div><button class="primary" style="margin-top:10px" onclick="startCareer('+p.id+')">開始人生</button></div>'}E('players').innerHTML=h}
function startCareer(id){var p=roster.find(function(x){return x.id===id});if(!p)return;current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.phase=0;current.trust=50;current.confidence=55;current.health=100;current.scout=0;current.usedSpecial={};current.log=[];current.seasonPoints=0;current.trainingDice=[];rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');addLog('🏁 '+current.name+' 從 HBL 高一開始生涯。');renderCareer();renderPhase()}
function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(function(x){return'<p>'+x+'</p>'}).join('')}
function year(){return current.grade===1?'高一':current.grade===2?'高二':'高三'}
function renderCareer(){E('stage').textContent='HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('trust').textContent=current.trust;E('confidence').textContent=current.confidence;E('health').textContent=current.health;E('scout').textContent=current.scout;E('chips').innerHTML=[current.pos,current.height+'cm',current.weight+'kg','臂展 '+current.wingspan+'cm',type(current),'Seed '+current.seed].map(function(x){return'<span class="chip">'+x+'</span>'}).join('');var h='';for(var k in current.skills)h+='<div class="stat"><span class="small">'+skillNames[k]+'</span><b>'+current.skills[k]+'</b></div>';E('stats').innerHTML=h;E('progress').innerHTML=phases.map(function(x,i){return'<span class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+(i<current.phase?'✓ ':'')+x+'</span>'}).join('')}
function baseScreen(eye,title,text){E('eyebrow').textContent=eye;E('storyTitle').textContent=title;E('storyText').textContent=text;E('choices').innerHTML='';E('diceArea').innerHTML='';E('result').classList.add('hidden');E('continueBtn').classList.add('hidden')}
function choice(title,desc,fn){var b=document.createElement('button');b.className='choice';b.innerHTML='<strong>'+title+'</strong><span>'+desc+'</span>';b.onclick=fn;E('choices').appendChild(b)}
function showResult(html){E('choices').innerHTML='';E('result').innerHTML=html;E('result').classList.remove('hidden');E('continueBtn').classList.remove('hidden');renderCareer()}
function renderPhase(){renderCareer();if(current.phase===0)intro();else if(current.phase===1)training();else if(current.phase===2)generalEvent();else if(current.phase===3)specialEvent();else if(current.phase===4)healthPhase();else if(current.phase===5)seasonPhase();else if(current.phase===6)growthPhase();else careerChoice()}
function intro(){var data={1:['新的球衣','你第一次走進高中校隊更衣室。學長的對抗、訓練量與教練要求都比國中高一個層級。教練沒有承諾任何上場時間，只告訴你：「這裡的位置要自己搶。」\n\n第一年最重要的，不是證明你什麼都會，而是先決定自己要靠什麼留在輪替。'],2:['輪替競爭','一年過去，教練已經知道你的優缺點。新生加入後，球隊競爭反而更激烈。高二通常是從「有潛力」變成「真的能用」的關鍵一年。'],3:['最後一次 HBL','高三沒有明年。球探、升學、球隊戰績與隊友期待一起壓了上來。你每一次選擇都會被放大，而這可能是你最後一次穿著高中球衣上場。']}[current.grade];baseScreen('年度序章｜HBL '+year(),data[0],data[1]);choice('準備好了','正式開始這一年的籃球生活。',function(){showResult('你把球鞋綁緊，走向球場。')})}
function training(){baseScreen('階段 2／8｜季初特訓','骰子決定你今年有多少訓練資源','教練安排四週個人強化。先擲出 4 顆六面骰，每顆骰子的點數就是這次能投入的訓練資源。你必須決定把它們集中在哪一種方向。');choice('🎲 擲出 4 顆訓練骰','先看看今年手上的資源。',function(){current.trainingDice=[1+dr(6),1+dr(6),1+dr(6),1+dr(6)];var sum=current.trainingDice.reduce(function(a,b){return a+b},0);E('diceArea').innerHTML='<div class="diceRow">'+current.trainingDice.map(function(x){return'<div class="die">'+x+'</div>'}).join('')+'</div><div class="small">總訓練點數：'+sum+'</div>';E('choices').innerHTML='';choice('🪄 持球與組織','控球、傳球、球商；大型球員的高控球更難練。',function(){applyTraining(['handle','pass','iq'],'持球與組織')});choice('🎯 投射','三分、中距離、罰球。',function(){applyTraining(['three','mid','ft'],'投射')});choice('💪 身體與終結','速度、力量、終結。',function(){applyTraining(['speed','strength','finish'],'身體與終結')});choice('🛡️ 防守','外線防守、內線防守、籃板。',function(){applyTraining(['defense','interior','rebound'],'防守')});choice('🧠 全面發展','點數較分散，但能修補弱項。',function(){applyTraining(Object.keys(current.skills),'全面發展')})})}
function applyTraining(pool,label){var sum=current.trainingDice.reduce(function(a,b){return a+b},0),changes=[];for(var i=0;i<4;i++){var k=pool[dr(pool.length)],cost=Math.max(2,Math.ceil(current.skills[k]/25)),chance=clamp(88-current.skills[k]*.55+(current.confidence-50)*.15,18,92);if(k==='handle'&&current.height>205)chance-=Math.round((current.height-205)*.8);var r=d100();var inc=r<=chance?Math.max(1,Math.floor(current.trainingDice[i]/cost)):0;if(r<=5)inc++;if(inc>0){current.skills[k]=clamp(current.skills[k]+inc,25,99);changes.push(skillNames[k]+' +'+inc+'（🎲'+r+'）')}else changes.push(skillNames[k]+' 無成長（🎲'+r+'）')}addLog('特訓｜'+label+'｜'+changes.join('、'));showResult('<b>'+label+'</b><br>'+changes.join('<br>')+'<br><br><span class="small">能力越高，成功率與點數轉換效率會逐漸降低。</span>')}
function generalEvent(){var pool=[{t:'教練把你留下來',x:'一次團隊訓練後，教練把你單獨叫住。他認為你有能力，但目前的角色太模糊：「你想要更多球權，就要證明你能處理壓力。」',a:['主動爭取持球','高風險，成功會增加角色與控球能力。'],b:['先把防守做好','較穩健，提升教練信任。'],kind:'role'},{t:'先發名單公布',x:'新一輪先發名單貼在更衣室門口，你的名字落在板凳席。旁邊有人拍拍你的肩，但你知道教練正在觀察你的反應。',a:['直接找教練談','可能爭取到更多機會，也可能被認為太急。'],b:['用訓練回應','較慢，但風險低。'],kind:'bench'},{t:'校內突然爆紅',x:'同學拍到你在練習賽的一次漂亮進球，短片意外在社群被大量轉發。有人開始在走廊認出你，也有人說你只是「影片型球員」。',a:['接受關注','增加曝光，但壓力也上升。'],b:['不理會社群','維持專注與穩定。'],kind:'viral'}];var e=pool[dr(pool.length)];baseScreen('階段 3／8｜一般事件',e.t,e.x);choice(e.a[0],e.a[1],function(){resolveGeneral(e.kind,0)});choice(e.b[0],e.b[1],function(){resolveGeneral(e.kind,1)})}
function resolveGeneral(kind,opt){var r=d100(),txt='';if(kind==='role'){if(opt===0){if(r<=58){current.trust+=10;current.skills.handle+=2;current.skills.pass+=1;txt='你在接下來的對抗賽處理得很好。教練開始讓你主導第二陣容。<br><b>教練信任 +10、控球 +2、傳球 +1</b>'}else{current.trust-=5;current.confidence-=4;txt='幾次失誤讓教練暫時收回球權。<br><b>信任 -5、信心 -4</b>'}}else{current.trust+=7;current.skills.defense+=1;txt='你用防守站穩腳步。<br><b>信任 +7、防守 +1</b>'}}if(kind==='bench'){if(opt===0){if(r<=50){current.trust+=8;current.scout+=3;txt='教練欣賞你的坦率，承諾給你更多輪替時間。<br><b>信任 +8</b>'}else{current.trust-=7;txt='教練認為你還沒準備好談角色。<br><b>信任 -7</b>'}}else{current.confidence+=5;current.skills.iq+=1;txt='你沒有抱怨，連續幾週在訓練中表現穩定。<br><b>信心 +5、球商 +1</b>'}}if(kind==='viral'){if(opt===0){current.scout+=8;current.confidence+=3;txt='曝光讓更多人注意到你，但之後的比賽也多了不少眼光。<br><b>球探關注 +8、信心 +3</b>'}else{current.confidence+=5;txt='你關掉通知，繼續把注意力留在球場。<br><b>信心 +5</b>'}}addLog('一般事件｜🎲 '+r+'｜'+txt.replace(/<[^>]+>/g,''));showResult('<span class="badge">D100：'+r+'</span><br><br>'+txt)}
var specials=[{id:'family',t:'家裡突然需要你',x:'家中出現狀況，你接下來幾週必須在放學後分擔更多事情。訓練時間勢必受到影響。',a:'硬撐維持全部訓練',b:'向教練說明並調整課表'},{id:'ankle',t:'腳踝落地不穩',x:'一次隊內對抗，你落地時踩到別人的腳。腳踝腫了起來，但兩週後就是重要比賽。',a:'帶傷繼續練',b:'完整休養'},{id:'conflict',t:'隊內火藥味',x:'高強度對抗後，你和一名隊友因為一次犯規互相推了一下，其他人立刻把你們分開。教練正往這裡走來。',a:'繼續據理力爭',b:'先把衝突停下來'}];
function specialEvent(){var chance=24,roll=d100();if(roll>chance){baseScreen('階段 4／8｜特殊事件','這一年沒有大風波','不是每段生涯都會遇到戲劇性事件。這一季目前沒有特殊事件發生，球隊把注意力留在籃球本身。');choice('繼續','進入下一階段。',function(){showResult('特殊事件檢定：🎲 '+roll+'。沒有觸發。')});return}var available=specials.filter(function(x){return !current.usedSpecial[x.id]});if(!available.length){current.usedSpecial={};available=specials.slice()}var e=available[dr(available.length)];current.usedSpecial[e.id]=true;baseScreen('階段 4／8｜特殊事件',e.t,e.x);choice(e.a,'風險較高，可能換到更大的即時收益。',function(){resolveSpecial(e.id,0)});choice(e.b,'通常較穩健，但也可能犧牲短期機會。',function(){resolveSpecial(e.id,1)})}
function resolveSpecial(id,opt){var r=d100(),txt='';if(id==='family'){if(opt===0){current.health-=8;current.confidence-=4;txt='你勉強維持全部行程，但疲勞快速累積。<br><b>健康 -8、信心 -4</b>'}else{current.trust+=4;current.health-=2;txt='教練理解你的狀況，幫你調整訓練量。<br><b>信任 +4、健康 -2</b>'}}if(id==='ankle'){if(opt===0){if(r<=35){current.confidence+=8;txt='你撐過傷勢並打出好表現。<br><b>信心 +8</b>'}else{current.health-=18;current.skills.speed-=2;txt='傷勢惡化，你錯過更多訓練。<br><b>健康 -18、速度 -2</b>'}}else{current.health-=5;current.trust+=3;txt='你完整休養後順利回歸。<br><b>健康 -5、信任 +3</b>'}}if(id==='conflict'){if(opt===0){current.trust-=10;current.confidence+=2;txt='教練直接終止訓練並要求你冷靜。<br><b>信任 -10</b>'}else{current.trust+=5;txt='你先停手，事情沒有繼續擴大。<br><b>信任 +5</b>'}}addLog('特殊事件｜'+id+'｜🎲 '+r);showResult('<span class="badge">D100：'+r+'</span><br><br>'+txt)}
function healthPhase(){baseScreen('階段 5／8｜健康管理','賽季前的負荷選擇','真正的比賽要開始了。你可以要求教練把訓練量拉高，換取更好的狀態與角色競爭；也可以保守管理身體，降低傷病風險。');choice('🔥 衝刺模式','提升短期能力與球探關注，但健康風險增加。',function(){current.skills.finish+=1;current.skills.speed+=1;current.scout+=4;current.health-=8;showResult('你選擇衝刺。<br><b>終結 +1、速度 +1、球探關注 +4、健康 -8</b>')});choice('⚖️ 正常負荷','沒有額外加成，也沒有額外風險。',function(){showResult('你維持正常負荷，準備進入賽季。')});choice('🧊 保守管理','恢復健康，但可能少掉一些競爭曝光。',function(){current.health=clamp(current.health+8,0,100);current.scout=Math.max(0,current.scout-2);showResult('你優先保護身體。<br><b>健康 +8、球探關注 -2</b>')})}
function seasonPhase(){baseScreen('階段 6／8｜HBL 賽季','真正的比賽開始了','接下來不是單純按一次「模擬」。系統會根據你的能力、教練信任、健康與信心決定角色，再產生整季數據與球隊成績。');choice('🏀 進入賽季','結算上場時間、數據、球隊戰績與獎項。',function(){var O=ovr(current),roleScore=O*.72+current.trust*.18+current.confidence*.1-(100-current.health)*.12;var role=roleScore>=80?'球隊核心':roleScore>=70?'先發':roleScore>=61?'主要輪替':roleScore>=53?'替補':'板凳末端';var mpg=role==='球隊核心'?31:role==='先發'?27:role==='主要輪替'?20:role==='替補'?12:6;var ppg=Math.max(1,((current.skills.finish+current.skills.mid+current.skills.three)/3-35)*.27*(mpg/24)+(rng()*4-2));var apg=Math.max(.4,(current.skills.pass-35)*.09*(mpg/24));var rpg=Math.max(.5,(current.skills.rebound-35)*.1*(mpg/24));var team=clamp(Math.round(35+O*.45+current.trust*.12+rng()*18),40,98);var finish=team>=88?'🏆 HBL 冠軍':team>=78?'🥈 四強':team>=66?'八強':team>=54?'複賽':'預賽止步';if(team>=88)current.hblTitles=(current.hblTitles||0)+1;if(ppg>=20&&mpg>=26){current.hblAwards=(current.hblAwards||0)+1;current.scout+=10}current.scout+=Math.max(0,Math.round((O-55)*.35));current.seasonPoints=Math.max(2,Math.round(ppg/5)+Math.round(mpg/10));current.lastSeason={role:role,mpg:mpg,ppg:ppg,rpg:rpg,apg:apg,finish:finish};addLog(year()+'賽季｜'+role+'｜'+ppg.toFixed(1)+'分 '+rpg.toFixed(1)+'籃板 '+apg.toFixed(1)+'助攻｜'+finish);showResult('<b>'+role+'</b>｜'+mpg+' MPG<br><br><b>'+ppg.toFixed(1)+' PPG　'+rpg.toFixed(1)+' RPG　'+apg.toFixed(1)+' APG</b><br><br>球隊結果：<b>'+finish+'</b><br>季末能力點：<b>'+current.seasonPoints+'</b>')})}
function growthPhase(){baseScreen('階段 7／8｜季末成長','把賽季經驗變成能力','賽季結束後，你得到 '+current.seasonPoints+' 點成長資源。選一個方向，系統會依現有能力與體型進行最後一次升級檢定。');choice('🎯 進攻技巧','投射與終結。',function(){spendSeason(['three','mid','finish'])});choice('🪄 持球組織','控球、傳球、球商。',function(){spendSeason(['handle','pass','iq'])});choice('🛡️ 防守籃板','外線防守、內線防守、籃板。',function(){spendSeason(['defense','interior','rebound'])});choice('💪 身體','速度與力量。',function(){spendSeason(['speed','strength'])})}
function spendSeason(pool){var pts=current.seasonPoints,changes=[];for(var i=0;i<pts;i++){var k=pool[dr(pool.length)],chance=clamp(84-current.skills[k]*.48,20,90);if(k==='handle'&&current.height>205)chance-=Math.round((current.height-205)*.7);var r=d100();if(r<=chance){current.skills[k]=clamp(current.skills[k]+1,25,99);changes.push(skillNames[k]+' +1')}else changes.push(skillNames[k]+' 失敗')}showResult(changes.join('<br>'));addLog('季末成長｜'+changes.join('、'))}
function careerChoice(){baseScreen('階段 8／8｜生涯抉擇',current.grade<3?'新學年就在前面':'高中生涯結束','你已經完成 '+year()+' 的所有流程。這一季的能力、事件、傷病與表現都會被保留下來。'+(current.grade<3?' 接下來升上下一個年級，新的事件池與角色競爭會重新開始。':' 高中階段已完成；大學與職業邀請會在下一個版本接上。'));if(current.grade<3){choice('進入下一學年','保留所有結果，開始新的 HBL 賽季。',function(){current.grade++;current.age++;current.phase=-1;showResult('你升上 '+year()+'。新的賽季即將開始。')})}else{choice('完成 HBL 生涯','查看目前高中階段的總結。',function(){showResult('<b>'+current.name+'</b><br>巔峰 OVR：'+ovr(current)+'<br>球探關注：'+current.scout+'<br>HBL 冠軍：'+(current.hblTitles||0)+'<br><br>下一版將從這裡接上升學／職業邀請。');E('continueBtn').classList.add('hidden')})}}
function advancePhase(){if(current.phase===-1){current.phase=0}else current.phase++;if(current.phase>7)current.phase=7;renderPhase()}function backSetup(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster()}
</script></body></html>
