<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.4</title><style>:root{--bg:#090d12;--panel:#141b25;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:#141b25;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:14px}.hidden{display:none!important}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#211504;border:0}.ghost{background:#111923}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.note{font-size:13px;line-height:1.7;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px;color:#cbd5e1}.players{display:grid;gap:9px}.player{background:#0f151d;border:1px solid var(--line);border-radius:13px;padding:12px}.career{display:grid;grid-template-columns:255px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:23px;font-weight:900}.name{font-size:17px;font-weight:900}.ovr{font-size:42px;font-weight:950}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;background:#202a38;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.sideStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{background:#0e151e;border:1px solid var(--line);border-radius:10px;padding:8px}.mini b{display:block;font-size:20px}.titleBox{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}.titleList{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.titleChip{font-size:11px;padding:6px 8px;border-radius:999px;background:#312916;border:1px solid #735f28;color:#ffe39a}.noTitle{font-size:11px;color:var(--muted)}.progress{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a}.step.done{color:var(--green)}.eyebrow{font-size:12px;color:var(--blue);font-weight:900}.storyTitle{font-size:27px;font-weight:950;margin:6px 0 12px}.story{font-size:16px;line-height:1.95;white-space:pre-line;color:#e7edf4}.scoreboard{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.board{background:#0b1118;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.choices,.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:17px}.choice,.offer{text-align:left;background:#121b27;border:1px solid #314158;padding:14px;border-radius:12px}.choice strong,.offer strong{display:block}.choice span,.offer span{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.55}.offer .country{color:var(--blue);font-size:11px}.offer .offerName{font-size:18px;font-weight:900;color:var(--txt)}.badge{display:inline-block!important;width:auto;margin-right:4px;padding:4px 7px;border-radius:7px;background:#1c2634}.chance{background:#173126;color:#9df0c6!important}.reward{background:#322b16;color:#ffe49a!important}.risk{background:#351d24;color:#ffb1c0!important}.titleBonus{background:#33284b;color:#d7c3ff!important}.result{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}.diceWrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:15px 0}.d20{width:92px;height:92px;position:relative}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:950}.attrTabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{width:auto;white-space:nowrap}.tab.active{background:#26364a}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:11px;padding:10px}.attrTop{display:flex;justify-content:space-between}.attrVal{font-size:21px;font-weight:900}.cost{font-size:11px;color:var(--muted)}.bar{height:5px;background:#090e14;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.plus{margin-top:7px}.log{max-height:230px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:10px}.log p{margin:0 0 7px}@media(max-width:950px){.career,.setup{grid-template-columns:1fr}.side{position:static}.attrGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.choices,.offers{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.4</span></h1><div class="small">HBL → 大學 → 條件式職業邀約｜稱號與事件檢定持續影響職業生涯</div></div><div id="setup" class="setup"><div><div class="card"><h2>球員基本資料</h2><div class="note">高一從尚未成熟的球員開始。身材影響部分初始能力，但不形成硬上限。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div><button class="primary" style="margin-top:12px" onclick="generatePlayer()">生成並開始生涯</button></div><div class="card"><h2>事件 Seed</h2><div class="note">Seed <b>不參與球員數值生成</b>，只決定事件順序、D20 與部分生涯分歧。</div><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>曾創建過的球員</h2><div id="players" class="players"><div class="small">尚未創建球員。</div></div></div></div><div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage"></div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:12px">OVR</div><div id="ovr" class="ovr"></div><div class="sideStats"><div class="mini"><span class="small">訓練點</span><b id="pool"></b></div><div class="mini"><span class="small">教練信任</span><b id="trust"></b></div><div class="mini"><span class="small">球探關注</span><b id="scout"></b></div><div class="mini"><span class="small">成功事件</span><b id="wins"></b></div></div><div class="titleBox"><span class="small">稱號</span><div id="titles" class="titleList"></div></div></div></aside><main><div id="progress" class="progress"></div><div class="card"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="offers" class="offers hidden"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card"><h2>能力值</h2><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="backHome()">← 回首頁</button></div></main></div></div><script>
var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';
var groups={'進攻':['touch','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};
var names={touch:'近框手感',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};
function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function ovr(p){return Math.round(avg(Object.values(p.skills)))}function cost(v){if(v<50)return 1;if(v<60)return 2;if(v<70)return 3;if(v<75)return 4;if(v<80)return 5;if(v<85)return 7;if(v<90)return 10;if(v<95)return 15;if(v<98)return 20;return 999}
function archetype(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=80&&s.three>=80&&s.block>=85)return'獨角獸';if(h>=205&&s.pass>=82&&s.vision>=82)return'全能組織長人';if(h>=198&&s.handle>=82&&s.pass>=80)return'控球前鋒';if(s.three>=82&&s.perdef>=80)return'3&D';if(s.pass>=82&&s.handle>=80)return'進攻發動機';return'尚未定型'}
function phases(){return['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']}
function abilityBonus(v){return clamp(Math.floor((v-45)/10),-2,5)}function checkTarget(dc){return clamp(10+Math.floor((dc-11)/2),8,15)}function eventType(c){var best='進攻',score=-1;Object.keys(groups).forEach(g=>{var n=c.keys.filter(k=>groups[g].includes(k)).length;if(n>score){score=n;best=g}});return best}
var titleDefs=[{id:'arsenal',name:'進攻萬花筒',types:['進攻'],bonus:2,desc:'進攻型事件 +2',cond:p=>avg(groups['進攻'].map(k=>p.skills[k]))>=58&&groups['進攻'].filter(k=>p.skills[k]>=60).length>=4},{id:'floorGeneral',name:'球場指揮官',types:['組織'],bonus:2,desc:'組織型事件 +2',cond:p=>avg(['handle','pass','vision','offiq'].map(k=>p.skills[k]))>=59},{id:'lock',name:'外線大鎖',types:['防守'],bonus:2,desc:'防守型事件 +2',cond:p=>avg(['perdef','defiq','steal'].map(k=>p.skills[k]))>=59},{id:'fortress',name:'禁區堡壘',types:['防守','籃板'],bonus:2,desc:'防守／籃板事件 +2',cond:p=>avg(['intdef','block','dreb'].map(k=>p.skills[k]))>=60},{id:'engine',name:'體能怪物',types:['身體'],bonus:2,desc:'身體型事件 +2',cond:p=>avg(['speed','accel','explosion','stamina'].map(k=>p.skills[k]))>=62},{id:'clutch',name:'大心臟',types:['ALL'],bonus:1,desc:'所有事件 +1',cond:p=>p.wins>=12&&p.trust>=70},{id:'proven',name:'職業級武器',types:['ALL'],bonus:1,desc:'職業事件額外穩定度',cond:p=>p.level==='pro'&&Math.max(...Object.values(p.skills))>=82&&p.proSeasons>=2}];
function titleBonus(c){if(!current||!current.titles)return 0;var type=eventType(c),b=0;current.titles.forEach(id=>{var t=titleDefs.find(x=>x.id===id);if(t&&(t.types.includes('ALL')||t.types.includes(type)))b+=t.bonus});return clamp(b,0,4)}function titleNamesFor(c){if(!current||!current.titles)return[];var type=eventType(c);return current.titles.map(id=>titleDefs.find(x=>x.id===id)).filter(t=>t&&(t.types.includes('ALL')||t.types.includes(type))).map(t=>t.name)}function successChance(v,dc,tb){var bonus=abilityBonus(v)+(tb||0),target=checkTarget(dc),ok=0;for(var r=1;r<=20;r++)if(r===20||(r!==1&&r+bonus>=target))ok++;return ok*5}
function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function checkTitles(){if(!current)return;current.titles=current.titles||[];titleDefs.forEach(t=>{if(!current.titles.includes(t.id)&&t.cond(current)){current.titles.push(t.id);addLog('🏅 獲得稱號【'+t.name+'】｜'+t.desc)}});renderTitles()}function renderTitles(){if(!current||!current.titles||!current.titles.length){E('titles').innerHTML='<span class="noTitle">尚未取得稱號</span>';return}E('titles').innerHTML=current.titles.map(id=>{var t=titleDefs.find(x=>x.id===id);return'<span class="titleChip" title="'+t.desc+'">【'+t.name+'】</span>'}).join('')}
function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(34,48);Object.keys(names).forEach(k=>p.skills[k]=clamp(base+ri(-8,9),22,58));p.skills.touch+=Math.round((p.height-195)/8);p.skills.dunk+=Math.round((p.height-195)/5);p.skills.intdef+=Math.round((p.height-195)/5);p.skills.block+=Math.round((p.wingspan-p.height)/4);p.skills.dreb+=Math.round((p.wingspan-p.height)/5);p.skills.strength+=Math.round((p.weight-88)/7);if(p.height>208){p.skills.handle-=Math.round((p.height-208)/5);p.skills.accel-=Math.round((p.height-208)/6)}Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],20,62));roster.push(JSON.parse(JSON.stringify(p)));renderRoster();startCareer(p)}
function renderRoster(){E('players').innerHTML=roster.map((p,i)=>'<div class="player"><b>'+p.name+'</b><div class="small">#'+(i+1)+'｜'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg｜初始 OVR '+ovr(p)+'</div></div>').join('')||'<div class="small">尚未創建球員。</div>'}
function startCareer(p){current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.level='hbl';current.phase=0;current.pool=0;current.trust=45;current.scout=0;current.wins=0;current.titles=[];current.log=[];current.eventOrder={};rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');prepareYear();addLog('🏁 '+current.name+' 的 HBL 生涯開始。');renderPhase()}function backHome(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster();scrollTo(0,0)}
function year(){if(current.level==='college')return'大'+['一','二','三','四'][current.collegeYear-1];if(current.level==='pro')return'職業第 '+current.proSeasons+' 季';return current.grade===1?'高一':current.grade===2?'高二':'高三'}function keyYear(){return current.level==='college'?'c'+current.collegeYear:current.level==='pro'?'p'+current.proSeasons:'h'+current.grade}function prepareYear(){var arr=[0,1,2,3,4];for(var i=4;i>0;i--){var j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}current.eventOrder[keyYear()]=arr}
function renderAll(){E('stage').textContent=current.level==='college'?current.college.short+' '+year():current.level==='pro'?current.pro.short+'｜'+year():'HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('trust').textContent=current.trust;E('scout').textContent=current.scout;E('wins').textContent=current.wins;E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>'+(current.level==='pro'?'<span class="chip">'+current.pro.country+'</span>':'');renderTitles();renderProgress();renderTabs();renderAttrs()}function renderProgress(){E('progress').innerHTML=phases().map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}function renderAttrs(){if(!current)return;var can=current.phase===2;E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return'<div class="attr"><div class="attrTop"><span>'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;addLog('📈 '+names[k]+' → '+current.skills[k]);checkTitles();renderAll()}
function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('offers').innerHTML='';E('offers').classList.add('hidden');E('result').className='result hidden';E('continueBtn').classList.add('hidden');E('continueBtn').textContent='繼續'}function d20html(n){return'<div class="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 92,28 82,78 50,97 18,78 8,28" fill="#b86b08" stroke="#ffd18a" stroke-width="2"/><polygon points="50,3 50,50 8,28" fill="#7f4705"/><polygon points="50,3 92,28 50,50" fill="#d18411"/><polygon points="8,28 50,50 18,78" fill="#a35d08"/><polygon points="92,28 82,78 50,50" fill="#915006"/><polygon points="18,78 50,50 50,97" fill="#c3730b"/></svg><div class="num">'+n+'</div></div>'}function ev(title,text,choices,score,clock){return{title,text,choices,score,clock}}function ch(t,d,keys,dc,s,f){return{t,d,keys,dc,s,f}}
var hblIntro={1:['第一天，你的名字在名單最下面','報到那天，球館裡已經有人練完一輪。國中時的得分與獎盃沒有跟著你進高中。第一次隊內對抗，你甚至被學長的碰撞直接撞出底線。\n\n教練沒有吹犯規，只對助教說：「先看看他會不會怕。」\n\n高一不是成名的一年。你得先證明自己值得進十二人名單。'],2:['第二年，沒有人再把你當新人','去年你坐過的板凳末端，現在坐著新的高一生。教練第一次在戰術講解時直接點名問你的意見。\n\n但同位置的學長還在，新生也有人天賦更好。你不能再用「還年輕」解釋失誤。\n\n高二真正的問題是：你只是可靠輪替，還是能成為主力？'],3:['最後一年，每一場都有倒數感','高三第一天，學弟叫你「學長」。牆上的新賽程一路排到決賽，你很清楚最後一格就是高中籃球的終點。\n\n大學教練、海外球探、隊友期待和自己的未來同時壓上來。\n\n高三不只是在拚 HBL，也是在為下一個層級打球。']};
function hblEvents(){var g=current.grade;if(g===1)return[ev('第一次被叫上場','第二節剩 4 分多鐘，教練突然喊你的名字：「先守住，不要送分。」\n\n對方後衛看到一年級上場，第一個回合就揮手叫隊友拉開。這不是集錦機會，而是你第一次回答教練：能不能留在場上？',[ch('先把防守做好','專注站位與換防。',['perdef','defiq'],11,'你連續守住兩回合，教練沒有換你下場。','你被假動作點起，下一個死球就被換下。'),ch('拿球就主動進攻','希望第一球就讓大家記住。',['handle','layup','speed'],13,'你完成第一次高中得分，板凳瞬間站起來。','你太急著證明自己，突破直接掉球。')]),ev('十二人名單只剩一格','資格賽前一週，白板上的十二人名單故意空著最後一格。你和另一名一年級只剩兩場隊內賽可以證明自己。',[ch('用進攻搶名額','提高持球和出手。',['three','layup','offiq'],13,'你打出最高效率，最後一格寫上你的名字。','你連續做出勉強選擇。'),ch('把髒活做到極致','防守、籃板、跑位都不放掉。',['perdef','dreb','offball'],11,'教練沒有稱讚你，但名單上有你的名字。','你太低調，另一人拿走名額。')]),ev('最後 8.4 秒，球到了你手上','第四節剩 8.4 秒，落後兩分。原本設計給學長的戰術被識破，第一接球點也被鎖死。球最後傳到你手上，全場突然只剩鞋底摩擦聲。',[ch('切入製造 2+1','攻擊禁區。',['layup','foulDraw','strength'],13,'你扛住碰撞進球，哨聲同時響起。','協防準時到位，球偏出。'),ch('強拔三分','最冒險但能直接反超。',['three','handle'],15,'三分乾淨穿網。','球砸在後框。'),ch('突破分球','吸引協防找隊友。',['handle','pass','vision'],12,'底角隊友得到完全空檔。','傳球路線被抄走。')],'68：70','8.4 秒'),ev('學長用身體測試你','連續幾天的五打五，三年級前鋒每次都刻意加重碰撞。他低聲說：「國中那套在這裡沒用。」',[ch('正面扛回去','接受身體對抗。',['strength','stamina'],13,'你在碰撞後完成進攻，學長拍了拍你的背。','你失去重心，教練提醒別被情緒帶走。'),ch('用節奏避開','用速度和腳步解決。',['accel','handle','offiq'],11,'你連續變速過掉第一步。','路線被提前卡死。')]),ev('八強賽前一晚','旅館熄燈後，你怎樣都睡不著。明天輸球，高一球季就結束。隊友有人想再加練，有人已經睡著。',[ch('加練半小時','用熟悉動作壓住焦慮。',['stamina','three','ft'],12,'最後十顆罰球全進，你終於睡著。','你練過頭，隔天雙腿很沉。'),ch('關手機直接睡','相信已完成的準備。',['offiq','stamina'],10,'你恢復完整。','你仍翻來覆去。')])];
if(g===2)return[ev('先發位置空出來了','畢業學長離隊，先發空出一格。教練讓你和另一名二年級輪流先發，最後只說：「我要能幫球隊贏的人。」',[ch('主動接管進攻','提高球權證明能當核心。',['handle','mid','offiq'],13,'你掌控了整段節奏。','你太想證明自己。'),ch('用全面表現贏位置','防守、籃板、傳球都補上。',['defiq','pass','dreb'],11,'你在場時球隊明顯更穩。','表現平均卻沒有改變比賽。')]),ev('主控受傷，球交給你','練習後教練把你留下：「你不是控衛，但接下來要像控衛一樣想。」',[ch('接下主要持球','把意外當角色升級。',['handle','pass','vision'],12,'你適應擋拆與節奏控制。','失誤讓球權被收回。'),ch('維持原打法','專注自己最熟悉的功能。',['offiq','offball'],10,'你維持高效率。','你錯過擴大角色的機會。')]),ev('對手全場包夾你','第四節剩 42 秒，你們領先一分。對方直接雙人壓迫，第一目標就是逼你交球。',[ch('控球硬闖','從兩人中間突破。',['handle','accel','speed'],13,'你穿過夾擊。','球被側邊碰掉。'),ch('提前長傳','在夾擊成形前破解。',['pass','vision','offiq'],12,'長傳形成二打一。','球直接飛出界。'),ch('護球等回接','降低失誤風險。',['strength','handle','offiq'],11,'你等到隊友成功回接。','八秒違例。')],'61：60','42 秒'),ev('淘汰賽守對方王牌','對方王牌連拿 9 分，教練指向他：「接下來交給你。」',[ch('貼身壓迫','不給舒服節奏。',['perdef','strength','defiq'],13,'你逼他投出失衡後仰。','他利用貼身一步過。'),ch('誘導弱側','把他帶進協防。',['perdef','defiq','speed'],12,'協防準時關門。','他看穿站位急停命中。'),ch('直接賭抄截','成功就是反快攻。',['steal','speed'],15,'你精準拍掉球。','你撲空一步。')]),ev('新學弟公開挑戰你','新生第一天就說最想取代你的位置。更衣室裡所有人都在看你怎麼處理。',[ch('場上正面壓制','用比賽建立順位。',['perdef','handle','strength'],12,'你的成熟度讓他安靜下來。','你被激怒後反而打得太急。'),ch('把他拉到旁邊談','接受競爭但把界線說清楚。',['pass','offiq','defiq'],10,'他開始尊重你。','隊內張力沒有改善。')])];
return[ev('隊長責任落到你身上','教練把隊長責任交給你。第一週就有人遲到、有人因球權冷戰。教練只說：「你想帶隊，就先處理人。」',[ch('接下溝通責任','成為球員與教練的橋樑。',['offiq','defiq','stamina'],12,'隊友開始願意先找你談。','你把太多事情扛在自己身上。'),ch('把界線畫清楚','只專注球場。',['offiq','stamina'],10,'你保持競技狀態。','部分隊友覺得你不願承擔。')]),ev('球探開始坐上看台','熱身時助教告訴你，有幾個大學教練與海外球探來看。從那一刻開始，每次失誤都像被放大。',[ch('刻意展示全面性','主動持球、傳球、防守。',['pass','perdef','handle'],13,'球探的筆記寫滿整頁。','你想展示太多反而失去節奏。'),ch('完全照平常打','不因球探改變。',['offiq','stamina'],10,'你打出穩定真實的比賽。','嘴上不在意，動作卻僵硬。')]),ev('八強前腳踝不舒服','熱身落地時腳踝刺痛。隊醫說沒有結構傷，但照正常時間打有惡化風險。',[ch('照常出賽','接受風險。',['stamina','strength'],14,'你撐完整場且沒有惡化。','第三節落地再次翻船。'),ch('限制時間','只留關鍵回合。',['offiq','stamina'],11,'你用有限時間維持效率。','節奏始終斷斷續續。')]),ev('最後一場高中主場','觀眾席第一次有人舉著你的名字。當廣播念到你，你突然意識到這可能是最後一次在這座球館穿高中球衣。',[ch('開場主動攻擊','用侵略性點燃全場。',['layup','three','offiq'],13,'第一球就命中。','你太想留下畫面。'),ch('先串起隊友','從傳球與防守開始。',['pass','vision','defiq'],11,'全隊很快找到節奏。','你過度無私。')]),ev('HBL 最後 11.2 秒','比分 72：72。暫停時教練把筆放下：「三年了。最後一次，你自己決定。」',[ch('急停中距離','用節奏創造出手。',['handle','mid','offiq'],13,'球在蜂鳴器前落網。','球碰前框彈出。'),ch('全力殺進籃下','把最後一球交給衝擊力。',['layup','foulDraw','explosion'],13,'你在碰撞中把球送進。','協防封住上籃。'),ch('吸引包夾找隊友','相信隊友。',['handle','pass','vision'],12,'隊友得到完全空檔。','傳球失去角度。')],'72：72','11.2 秒')]}
function bestSkillKey(){return Object.keys(current.skills).sort((a,b)=>current.skills[b]-current.skills[a])[0]}
function rewardFor(c){var pts=c.dc>=15?3:c.dc>=13?2:1,trust=c.dc>=15?6:c.dc>=13?4:3,scout=(current.level==='college'||current.level==='pro'||current.grade===3)?2:0;return{pts:pts,trust:trust,scout:scout,skill:c.keys[0]}}function riskFor(c){return c.dc>=15?3:2}
function showEvent(e,label){current.event=e;E('eyebrow').textContent=label;E('storyTitle').textContent=e.title;if(e.score)E('scoreboard').innerHTML='<div class="scoreboard"><div class="board">比分<br><b>'+e.score+'</b></div><div class="board">時間<br><b>'+e.clock+'</b></div></div>';E('storyText').textContent=e.text;E('choices').innerHTML=e.choices.map((c,i)=>{var sk=Math.round(avg(c.keys.map(k=>current.skills[k]))),tb=titleBonus(c),pct=successChance(sk,c.dc,tb),rw=rewardFor(c),tn=titleNamesFor(c);return'<button class="choice" onclick="resolveChoice('+i+')"><strong>'+c.t+'</strong><span>'+c.d+'</span><span class="badge">考驗：'+c.keys.map(k=>names[k]).join('＋')+'｜難度 '+c.dc+'</span><span class="badge chance">成功率 '+pct+'%</span>'+(tb?'<span class="badge titleBonus">稱號 +'+tb+'｜'+tn.join('、')+'</span>':'')+'<span class="badge reward">成功：訓練點 +'+rw.pts+'、信任 +'+rw.trust+'、'+names[rw.skill]+' +1</span><span class="badge risk">失敗：信任 -'+riskFor(c)+'</span></button>'}).join('')}
function resolveChoice(i){var c=current.event.choices[i],sk=Math.round(avg(c.keys.map(k=>current.skills[k]))),ab=abilityBonus(sk),tb=titleBonus(c),target=checkTarget(c.dc),r=d20(),total=r+ab+tb,ok=r===20||(r!==1&&total>=target),rw=rewardFor(c);E('choices').innerHTML='';E('diceArea').innerHTML='<div class="diceWrap">'+d20html(r)+'<div>能力平均 '+sk+'｜能力修正 '+(ab>=0?'+':'')+ab+(tb?'｜稱號 +'+tb:'')+'<br><b>最終 '+total+' vs 門檻 '+target+'</b></div></div>';E('result').className='result '+(ok?'success':'fail');if(ok){current.pool+=rw.pts;current.trust=clamp(current.trust+rw.trust,0,100);current.scout=clamp(current.scout+rw.scout,0,100);current.skills[rw.skill]=clamp(current.skills[rw.skill]+1,0,99);current.wins++;E('result').innerHTML='<b>✅ 成功</b><br>'+c.s+'<br><br>獲得：訓練點 +'+rw.pts+'、教練信任 +'+rw.trust+'、'+names[rw.skill]+' +1'}else{var loss=riskFor(c);current.trust=clamp(current.trust-loss,0,100);E('result').innerHTML='<b>❌ 失敗</b><br>'+c.f+'<br><br>代價：教練信任 -'+loss}addLog((ok?'✅ ':'❌ ')+year()+'｜'+current.event.title);checkTitles();renderAll();E('continueBtn').classList.remove('hidden')}
function trainingPhase(){E('eyebrow').textContent='PRESEASON TRAINING';E('storyTitle').textContent='季前特訓：2D20';E('storyText').textContent='兩顆 D20 代表這段時間真正能掌握的訓練資源。能力越高，繼續突破成本越大。';var a=d20(),b=d20();current.pool+=a+b;E('diceArea').innerHTML='<div class="diceWrap">'+d20html(a)+d20html(b)+'<div><b>本季獲得 '+(a+b)+' 點</b><br>'+a+' + '+b+'</div></div>';addLog('🎲 '+year()+' 特訓：'+a+' + '+b+' = '+(a+b));E('continueBtn').classList.remove('hidden');renderAll()}
var collegeRoutes=[{id:'uba',country:'台灣',name:'UBA 一級一般校',short:'UBA',diff:0,ok:p=>ovr(p)>=45},{id:'ubaElite',country:'台灣',name:'UBA 一級強權',short:'UBA 強權',diff:1,ok:p=>ovr(p)>=53&&p.trust>=58},{id:'japan',country:'日本',name:'日本大學一級聯賽',short:'日本大學',diff:1,ok:p=>ovr(p)>=54&&p.scout>=10},{id:'korea',country:'韓國',name:'韓國大學聯賽',short:'韓國大學',diff:2,ok:p=>ovr(p)>=55&&p.scout>=14},{id:'philippines',country:'菲律賓',name:'菲律賓大學頂級聯賽',short:'菲律賓大學',diff:2,ok:p=>ovr(p)>=54&&p.scout>=15},{id:'d2',country:'美國',name:'NCAA Division II',short:'NCAA D2',diff:2,ok:p=>ovr(p)>=58&&p.scout>=20&&p.wins>=8},{id:'d1',country:'美國',name:'NCAA Division I',short:'NCAA D1',diff:3,ok:p=>ovr(p)>=64&&p.scout>=28&&p.wins>=10&&Math.max(...Object.values(p.skills))>=72}];
function showCollegeOffers(){resetStory();current.level='offers';E('stage').textContent='升學招募';E('progress').innerHTML='';E('eyebrow').textContent='RECRUITING';E('storyTitle').textContent='高中畢業後，你真正收到哪些邀約？';E('storyText').textContent='三年的能力、教練評價、球探關注與事件表現共同決定選項。沒有達到條件的路線不會出現。';var list=collegeRoutes.filter(x=>x.ok(current));if(!list.length)list=[{id:'walkon',country:'台灣',name:'大專校隊試訓',short:'大專試訓',diff:0}];E('offers').classList.remove('hidden');E('offers').innerHTML=list.map(x=>'<button class="offer" onclick="chooseCollege(\''+x.id+'\')"><span class="country">'+x.country+'</span><span class="offerName">'+x.name+'</span><span>依照你的高中履歷出現的正式路線。</span></button>').join('')}
function chooseCollege(id){var r=id==='walkon'?{id:'walkon',country:'台灣',name:'大專校隊試訓',short:'大專試訓',diff:0}:collegeRoutes.find(x=>x.id===id);current.level='college';current.college=r;current.collegeYear=1;current.phase=0;current.trust=Math.max(38,Math.round(current.trust*.75));current.wins=0;prepareYear();addLog('🎓 接受 '+r.name+'，進入大一。');renderPhase()}
function collegeIntro(){var y=current.collegeYear,n=current.college.name;if(y===1)return{title:'高中履歷只夠換一次自我介紹',text:'第一次走進 '+n+' 球館，你發現所有新生都曾是高中核心。你的 HBL 經歷讓大家知道你是誰，卻不能替你守住任何上場時間。\n\n大一第一關不是冠軍，而是讓教練在需要換人時想到你的名字。'};if(y===2)return{title:'第二年，第一次有人來搶你的位置',text:'你已經熟悉環境，但新一屆同位置球員報到。去年你是挑戰者，今年你第一次成為被挑戰的人。\n\n大二決定你能不能從「可以用」變成「必須用」。'};if(y===3)return{title:'大三，球探開始問你現在能做什麼',text:'球探不再只談潛力。你的效率、對位、失誤與弱點都被拆開檢查。\n\n這一年，每一場高曝光比賽都可能讓下一條路突然變寬。'};return{title:'大四：籃球第一次變成職業選擇',text:'定裝照時大四球員站到最前面。現在學弟問你職業試訓、經紀人與海外聯賽，你自己其實也還在等答案。\n\n最後一季會決定畢業後能不能繼續把籃球當工作。'}}
function collegeEvents(){var d=current.college.diff||0,y=current.collegeYear;return[ev('輪替表上，你仍在邊緣','教練公布第一版輪替，你排在主要替補之外。每一次練習都可能改變順位。',[ch('先靠防守取得信任','從不需要球權的工作開始。',['perdef','defiq','stamina'],11+d,'你連續守住主力，順位往前。','防守仍跟不上節奏。'),ch('直接展示進攻上限','用得分迫使教練注意。',['handle','three','layup'],13+d,'你在對抗賽連續得分。','出手太急，隊友開始不願交球。')]),ev('第一次遇到長期低潮','連續三場命中率很差，上一場甚至被按在板凳。你開始在接球時猶豫。',[ch('照原本方式出手','相信手感會回來。',['offiq','stamina','mid'],12+d,'下一場手感終於回來。','低潮繼續延長。'),ch('從防守與傳球重建','先降低得分壓力。',['defiq','pass','offball'],10+d,'你用其他方式重新留在場上。','你變得太保守。')]),ev('全國舞台的關鍵兩分鐘','淘汰賽最後兩分鐘只差一球，一名主力犯滿，你被臨時叫上場。',[ch('主動要求球權','冷手也直接解決。',['handle','three','mid'],13+d,'你連續完成兩個關鍵進攻。','你第一球就投短。'),ch('先做正確閱讀','找最佳進攻。',['pass','vision','offiq'],11+d,'關鍵助攻決定勝負。','你太怕犯錯錯過空檔。')],'77：76','1:48'),ev('職業球探第一次問你的名字','助教告訴你，有職業球探直接向教練詢問你的角色與訓練態度。',[ch('擴大技能包','展示更多持球與組織。',['handle','pass','offiq'],12+d,'全面性讓評價上升。','你做了太多不熟悉的事。'),ch('把最強武器做到極致','讓招牌能力更難忽略。',[bestSkillKey(),'offiq'],11+d,'你的強項成為球探報告重點。','對手開始針對單一強項。')]),ev(y===4?'大學生涯最後一場':'球季最後一戰',y===4?'四年裡你從板凳、輪替一路走到今天。無論接下來有沒有職業合約，這都是最後一次以大學生身分打正式比賽。':'最後一戰會成為教練規劃下一年角色的重要參考。',[ch('自己完成關鍵回合','把球留在手上。',['handle','layup','offiq'],12+d,'你完成關鍵進攻。','對手守住第一選擇。'),ch('閱讀找到最好機會','不預設誰出手。',['pass','vision','offiq'],11+d,'你送出關鍵助攻。','最後機會在輪轉中消失。')],'81：80','24 秒')]}

{id:'sbl',country:'台灣',name:'SBL 超級籃球聯賽',short:'SBL',diff:0,tier:1,desc:'台灣本土次級／半職業舞台，容易爭取大量上場時間。',ok:p=>ovr(p)>=50},

{id:'nba',country:'美國',name:'NBA',short:'NBA',diff:5,tier:6,desc:'最高門檻。只有極少數履歷會在第一份職業合約就出現。',ok:p=>ovr(p)>=74&&p.scout>=55&&p.wins>=16&&p.titles.length>=2&&Math.max(...Object.values(p.skills))>=84&&(p.college&&p.college.id==='d1')}
];
function showProOffers(){resetStory();current.level='proOffers';E('stage').textContent='職業招募';E('progress').innerHTML='';E('eyebrow').textContent='PRO MARKET';E('storyTitle').textContent='大學結束，籃球第一次變成一份工作';E('storyText').textContent='最後一場大學比賽結束後，真正的等待開始了。\n\n有些聯盟透過選秀，有些球隊直接邀請試訓；有人看你的天花板，也有人只在乎你能不能立刻填補輪替。大學名氣不會自動換成職業合約。\n\n下面只會出現你目前履歷真正有機會進入的職業層級。NBA 與 G League 不會因為畢業就自動解鎖。';var list=proRoutes.filter(x=>x.ok(current));if(!list.length)list=[{id:'sbl',country:'台灣',name:'SBL 試訓合約',short:'SBL',diff:0,tier:1,desc:'從試訓與短約開始爭取職業位置。'}];E('offers').classList.remove('hidden');E('offers').innerHTML=list.map(x=>'<button class="offer" onclick="choosePro(\''+x.id+'\')"><span class="country">'+x.country+'｜Tier '+x.tier+'</span><span class="offerName">'+x.name+'</span><span>'+x.desc+'</span></button>').join('')}
function choosePro(id){var r=proRoutes.find(x=>x.id===id)||{id:'sbl',country:'台灣',name:'SBL 超級籃球聯賽',short:'SBL',diff:0,tier:1};current.level='pro';current.pro=r;current.proSeasons=1;current.phase=0;current.trust=45;current.scout=Math.max(current.scout,10);current.wins=0;prepareYear();addLog('💼 簽下第一份職業合約：'+r.name);renderPhase()}
function proIntro(){var r=current.pro,s=current.proSeasons;if(s===1)return{title:'第一份合約沒有保證你能留下',text:'簽約那天，你盯著紙上的聯盟標誌看了很久。從今天起，籃球不再只是校隊身分，而是一份會被績效、合約與名額直接衡量的工作。\n\n第一次走進 '+r.name+' 的職業球館，老將沒有因為你的大學履歷多看一眼。教練只提醒：「新人先證明自己能在八分鐘裡不傷害球隊。」\n\n職業第一季，真正的目標不是成為明星，而是先讓下一份合約存在。'};return{title:'職業第 '+s+' 季：角色和身價重新洗牌',text:'休賽季結束，你再次回到職業球館。上一季留下的數據、稱號與比賽片段都成了球隊評估你的資料。\n\n但聯盟每年都有人加入，也有人突然失去位置。你現在要爭的不只是上場，而是更高級別的角色、薪資與下一個聯盟。'}}
function proEvents(){var d=current.pro.diff||0,r=current.pro;return[ev('季前名單最後幾格正在縮小','職業隊不會為了培養你而保留無限時間。季前熱身賽後，助教把輪替分成「確定」「競爭中」「邊緣」三組，你的名字就在中間那欄。',[ch('先把失誤降到最低','用防守與正確選擇守住位置。',['defiq','offiq','stamina'],11+d,'教練開始把你視為可靠替補。','你過度保守，存在感不足。'),ch('用得分搶進輪替','提高侵略性。',['three','layup','handle'],13+d,'你靠爆發得分擠進正式輪替。','你效率太差，反而讓競爭者領先。')]),ev('第一次被職業級對手連續針對','對手在暫停後連續三個回合叫同一套戰術，明顯就是要找你。場邊球探、教練和替補席都看得出來。',[ch('正面接受單防','不換防、不躲。',['perdef','defiq','strength'],13+d,'你守下最重要的一球，教練對你點頭。','你被連續打進，暫停後被換下。'),ch('提早呼叫團隊協防','用判斷而不是英雄式單防。',['defiq','vision','speed'],11+d,'你成功把進攻導進陷阱。','溝通慢半拍，出現完全空檔。')]),ev('第四節，教練第一次把關鍵球交給你','剩下 36 秒，比分只差一分。過去這種回合你通常在場邊看老將處理，但今天主力被包夾，教練轉頭直接叫你的名字。',[ch('直接攻擊籃框','相信自己的終結。',['layup','foulDraw','explosion'],13+d,'你製造犯規並穩穩罰進。','協防把你堵在籃下。'),ch('用擋拆閱讀防守','把選擇留到最後。',['handle','pickroll','pass'],12+d,'你讀到換防並找到空檔。','你猶豫半拍被逼停球。'),ch('強拔三分','高風險直接反超。',['three','handle'],15+d,'球穿網，全場炸開。','球砸框而出。')],'88：89','36 秒'),ev('經紀人告訴你海外球隊開始詢價','一場好表現後，經紀人傳來訊息：另一個聯盟的球隊問了你的合約狀況。這不是正式報價，但代表你的名字第一次跨出現在的市場。',[ch('擴張技能包','為更高層級準備。',['handle','pass','three'],13+d,'你的多功能性讓外界評價上升。','你試太多新東西導致效率下降。'),ch('把現有角色做到最好','先在現在聯盟建立穩定履歷。',[bestSkillKey(),'offiq'],11+d,'你變成教練最放心的固定角色。','對手逐漸掌握你的單一模式。')]),ev('季後賽／季末最後一戰','球季最後階段，對手針對你的球探報告已經非常完整。這一場不只是勝負，也會直接影響下一份合約。',[ch('承擔更多責任','主動接下高壓回合。',['stamina','offiq',bestSkillKey()],13+d,'你在最重要的比賽打出代表作。','你在高壓下失去效率。'),ch('相信團隊體系','不為合約強行刷數據。',['pass','defiq','offiq'],11+d,'球隊贏球，你的職業評價反而更穩。','你太低調，市場沒有留下深刻印象。')],'96：95','1:06')]}
function renderPhase(){resetStory();renderAll();if(current.phase===0){var x=current.level==='college'?collegeIntro():current.level==='pro'?proIntro():{title:hblIntro[current.grade][0],text:hblIntro[current.grade][1]};E('eyebrow').textContent=current.level==='college'?'COLLEGE SEASON OPENING':current.level==='pro'?'PRO SEASON OPENING':'HBL SEASON OPENING';E('storyTitle').textContent=x.title;E('storyText').textContent=x.text;E('continueBtn').classList.remove('hidden')}else if(current.phase===1)trainingPhase();else if(current.phase===2){E('eyebrow').textContent='PLAYER DEVELOPMENT';E('storyTitle').textContent='這一季要把自己練成什麼樣？';E('storyText').textContent='能力越高，升級成本越高。稱號會在能力與生涯表現達標後自動解鎖，並直接影響事件成功率。';E('continueBtn').classList.remove('hidden');renderAttrs()}else if(current.phase>=3&&current.phase<=7){var slot=current.phase-3,arr=current.level==='college'?collegeEvents():current.level==='pro'?proEvents():hblEvents();showEvent(arr[current.eventOrder[keyYear()][slot]],(current.level==='pro'?current.pro.short:current.level==='college'?current.college.short:'HBL')+' '+year()+'｜事件 '+(slot+1)+'/5')}else seasonSummary()}
function seasonSummary(){resetStory();checkTitles();renderAll();E('eyebrow').textContent='SEASON END';E('storyTitle').textContent=year()+'賽季結束';var diff=current.level==='college'?(current.college.diff||0):current.level==='pro'?(current.pro.diff||0):0,rating=ovr(current)+Math.floor((current.trust-45)/10)-diff*2;var p=Math.max(2,Math.round((rating-28)*.34)),rb=Math.max(1,Math.round((current.skills.dreb+current.skills.oreb-55)/18)),a=Math.max(1,Math.round((current.skills.pass+current.skills.vision-55)/18));E('storyText').textContent='漫長球季終於停下來。\n\n場均 '+p+' 分｜'+rb+' 籃板｜'+a+' 助攻\n教練信任 '+current.trust+'｜球探關注 '+current.scout+'｜目前 OVR '+ovr(current)+'\n稱號 '+current.titles.length+' 個。';if(current.level==='college')E('continueBtn').textContent=current.collegeYear<4?'進入下一學年':'進入職業市場';else if(current.level==='pro')E('continueBtn').textContent='進入休賽季／查看職業市場';else E('continueBtn').textContent=current.grade<3?'進入下一學年':'查看大學邀約';E('continueBtn').classList.remove('hidden')}
function showNextProMarket(){resetStory();E('stage').textContent='職業休賽季';E('progress').innerHTML='';E('eyebrow').textContent='FREE AGENCY / OFFSEASON';E('storyTitle').textContent='下一份合約，不一定還在同一個聯盟';E('storyText').textContent='球季結束後，現有球隊願意續約；同時，隨著你的 OVR、稱號與職業履歷改變，更高層級的市場也可能打開。\n\n你可以留隊，也可以選擇目前真正願意給你機會的其他聯盟。';var list=proRoutes.filter(x=>x.id===current.pro.id||x.ok(current));E('offers').classList.remove('hidden');E('offers').innerHTML=list.map(x=>'<button class="offer" onclick="continuePro(\''+x.id+'\')"><span class="country">'+x.country+(x.id===current.pro.id?'｜續約':'｜新邀約')+'</span><span class="offerName">'+x.name+'</span><span>'+x.desc+'</span></button>').join('')}
function continuePro(id){var r=proRoutes.find(x=>x.id===id);if(r.id!==current.pro.id)addLog('✈️ 轉戰 '+r.name);else addLog('📝 與 '+r.name+' 完成續約');current.level='pro';current.pro=r;current.proSeasons++;current.phase=0;current.trust=Math.max(38,current.trust-5);current.scout=clamp(current.scout+2,0,100);prepareYear();checkTitles();renderPhase()}
function advance(){if(current.level==='offers'||current.level==='proOffers')return;if(current.phase<8){current.phase++;renderPhase();return}if(current.level==='hbl'){if(current.grade<3){current.grade++;current.phase=0;prepareYear();addLog('📅 進入 HBL '+year());renderPhase()}else showCollegeOffers();return}if(current.level==='college'){if(current.collegeYear<4){current.collegeYear++;current.phase=0;current.trust=Math.max(35,current.trust-4);prepareYear();addLog('📅 進入 '+current.college.short+' '+year());renderPhase()}else showProOffers();return}if(current.level==='pro'){showNextProMarket()}}
</script></body></html>
