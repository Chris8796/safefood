<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Basketball Life v1.2.1</title><style>
:root{--bg:#090d12;--panel:#141b25;--line:#2a3647;--txt:#f4f7fb;--muted:#9ba8b8;--orange:#f59e0b;--blue:#60a5fa;--green:#34d399;--red:#fb7185;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070a0e,#101722);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1240px;margin:auto;padding:18px}.topbar{margin-bottom:16px}.topbar h1{margin:0;font-size:29px}.small{font-size:12px;color:var(--muted)}.card{background:rgba(20,27,37,.98);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 32px rgba(0,0,0,.18)}h2{margin:0 0 12px;font-size:18px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d131b;color:var(--txt);font-size:14px}button{cursor:pointer;font-weight:800}.primary{background:var(--orange);color:#1c1305;border:0}.ghost{background:#111923}.hidden{display:none!important}.note{font-size:13px;line-height:1.65;color:#c9d2dd;background:#101723;border-left:3px solid var(--orange);padding:10px;border-radius:9px;margin-bottom:12px}.setup{display:grid;grid-template-columns:390px 1fr;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}.players{display:grid;gap:10px}.player{background:#0f151d;border:1px solid var(--line);border-radius:14px;padding:13px}.playerhead{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:900}.score{font-size:24px;font-weight:900;color:var(--orange)}.career{display:grid;grid-template-columns:245px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.stage{font-size:24px;font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:#202a38;border:1px solid var(--line)}.ovr{font-size:42px;font-weight:950;margin:6px 0}.sideStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.mini{background:#0e151e;border:1px solid var(--line);border-radius:10px;padding:8px}.mini b{display:block;font-size:20px}.pool{font-size:26px!important;color:var(--orange)}.progress{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#111923;border:1px solid var(--line);font-size:12px;color:var(--muted)}.step.active{background:#2b2111;color:#ffd38a;border-color:#6f4b0d}.step.done{color:var(--green)}.storyCard{min-height:350px}.eyebrow{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:.05em;margin-bottom:7px}.storyTitle{font-size:27px;font-weight:950;margin-bottom:10px}.story{font-size:16px;line-height:1.9;color:#e7edf4;white-space:pre-line}.scoreboard{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.board{background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:10px 13px}.board b{font-size:21px}.clock{color:var(--orange)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}.choice{text-align:left;background:#121b27;padding:14px;border:1px solid #314158}.choice strong{display:block;font-size:15px}.choice span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.55}.test,.chance,.reward,.risk{display:inline-block;margin-top:7px;margin-right:4px;padding:4px 7px;border-radius:7px;font-size:11px}.test{background:#1c2634;color:#c9dcf5}.chance{background:#173126;color:#9df0c6}.reward{background:#322b16;color:#ffe49a}.risk{background:#351d24;color:#ffb1c0}.result{margin-top:15px;background:#0f151e;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.75}.success{border-color:#246c55}.fail{border-color:#7e3341}.diceWrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:18px 0}.d20{width:96px;height:96px;position:relative;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:drop .5s ease-out}.d20 svg{width:100%;height:100%}.d20 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;text-shadow:0 2px 5px #000}@keyframes drop{0%{transform:translateY(-28px) rotate(-18deg) scale(.82);opacity:0}75%{transform:translateY(3px) rotate(4deg) scale(1.04)}100%{transform:none;opacity:1}}.attrCard{margin-top:16px}.attrTabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px;margin-bottom:10px}.tab{width:auto;white-space:nowrap;background:#111923;padding:8px 12px}.tab.active{background:#26364a;border-color:#55759e}.attrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.attr{background:#0f151e;border:1px solid var(--line);border-radius:12px;padding:10px}.attrTop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.attrName{font-size:12px;color:#ccd6e2}.attrVal{font-size:22px;font-weight:950}.cost{font-size:11px;color:var(--muted);margin-top:2px}.plus{margin-top:7px;padding:7px;background:#243247}.plus:disabled{opacity:.35}.bar{height:5px;background:#090e14;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange))}.log{max-height:230px;overflow:auto;background:#0b1017;border:1px solid var(--line);border-radius:12px;padding:10px}.log p{margin:0 0 8px;line-height:1.5}.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.offer{background:#101923;border:1px solid #34465e;border-radius:14px;padding:15px;text-align:left}.offer:hover{border-color:#6d8fb8}.offer .country{font-size:11px;color:var(--blue);font-weight:900}.offer .offerName{font-size:18px;font-weight:950;margin-top:3px}.offer .meta{font-size:12px;color:var(--muted);line-height:1.65;margin-top:7px}.offer .fit{margin-top:9px;font-size:11px;color:#a9f0c9;background:#153127;border-radius:7px;padding:5px 7px;display:inline-block}.noOffer{padding:13px;border:1px dashed #526174;border-radius:12px;color:var(--muted);margin-top:12px}@media(max-width:950px){.career{grid-template-columns:1fr}.side{position:static}.setup{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.choices,.offers{grid-template-columns:1fr}.attrGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:12px}.storyTitle{font-size:23px}}@media(max-width:430px){.row{grid-template-columns:1fr}.attr{padding:9px}.attrVal{font-size:20px}}</style></head><body><div class="wrap"><div class="topbar"><h1>🏀 Basketball Life <span class="small">v1.2.1</span></h1><div class="small">HBL → 條件式大學邀約 → 四年大學劇情</div></div><div id="setup" class="setup"><div><div class="card"><h2>① 球員基本資料</h2><div class="note">填好資料後按下「生成並開始生涯」，系統會直接生成球員並進入 HBL 高一。</div><div class="row"><div><label>姓名</label><input id="name" value="Chris"></div><div><label>位置</label><select id="pos"><option>PG</option><option>SG</option><option selected>SF</option><option>PF</option><option>C</option></select></div></div><div class="row"><div><label>身高 cm</label><input id="height" type="number" value="203"></div><div><label>體重 kg</label><input id="weight" type="number" value="98"></div></div><div class="row"><div><label>臂展 cm</label><input id="wingspan" type="number" value="216"></div><div><label>體型</label><select id="body"><option>精瘦</option><option selected>標準</option><option>壯碩</option><option>厚重</option></select></div></div><div class="row"><div><label>慣用手</label><select id="hand"><option>右手</option><option>左手</option></select></div></div><button class="primary" onclick="generatePlayer()">生成並開始生涯</button></div><div class="card" style="margin-top:16px"><h2>② 事件 Seed</h2><input id="seed" value="THREADS-2026"></div></div><div class="card"><h2>③ 曾創建過的球員</h2><div id="players" class="players"><div class="small">尚未創建球員。</div></div></div></div><div id="career" class="career hidden"><aside class="side"><div class="card"><div id="stage" class="stage">HBL 高一</div><div id="careerName" class="name"></div><div id="chips" class="chips"></div><div class="small" style="margin-top:13px">OVR</div><div id="ovr" class="ovr">--</div><div class="sideStats"><div class="mini"><span class="small">訓練點</span><b id="pool" class="pool">0</b></div><div class="mini"><span class="small">教練信任</span><b id="trust">50</b></div><div class="mini"><span class="small">球探關注</span><b id="scout">0</b></div><div class="mini"><span class="small">事件成功</span><b id="wins">0</b></div></div></div></aside><main><div id="progress" class="progress"></div><div class="card storyCard"><div id="eyebrow" class="eyebrow"></div><div id="storyTitle" class="storyTitle"></div><div id="scoreboard"></div><div id="storyText" class="story"></div><div id="diceArea"></div><div id="choices" class="choices"></div><div id="offers" class="offers hidden"></div><div id="result" class="result hidden"></div><button id="continueBtn" class="primary hidden" style="margin-top:13px" onclick="advance()">繼續</button></div><div class="card attrCard"><h2>能力值</h2><div id="attrTabs" class="attrTabs"></div><div id="attributes" class="attrGrid"></div></div><div class="card" style="margin-top:16px"><h2>生涯紀錄</h2><div id="log" class="log"></div><button class="ghost" style="margin-top:9px" onclick="backHome()">← 回首頁</button></div></main></div></div><script>
var roster=[],current=null,idSeq=1,rng=Math.random,activeGroup='進攻';var groups={'進攻':['touch','layup','dunk','foulDraw','post','mid','three','ft','offball'],'組織':['handle','pass','vision','pickroll','offiq'],'防守':['perdef','intdef','steal','block','defiq'],'籃板':['oreb','dreb'],'身體':['speed','accel','explosion','vertical','strength','stamina']};var names={touch:'近框手感',layup:'上籃',dunk:'灌籃',foulDraw:'製造犯規',post:'背框',mid:'中距離',three:'三分',ft:'罰球',offball:'無球進攻',handle:'控球',pass:'傳球',vision:'傳球視野',pickroll:'擋拆',offiq:'進攻球商',perdef:'外線防守',intdef:'內線防守',steal:'抄截',block:'阻攻',defiq:'防守球商',oreb:'進攻籃板',dreb:'防守籃板',speed:'速度',accel:'加速',explosion:'爆發力',vertical:'彈跳',strength:'力量',stamina:'體能'};function E(x){return document.getElementById(x)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}function hash(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function d20(){return Math.floor(rng()*20)+1}function cost(v){if(v<60)return 1;if(v<70)return 2;if(v<75)return 3;if(v<80)return 4;if(v<85)return 5;if(v<90)return 7;if(v<95)return 10;if(v<98)return 15;if(v<99)return 20;return 999}function ovr(p){return Math.round(avg(Object.values(p.skills)))}function skillMod(skill){return clamp(Math.floor((skill-20)/5),0,15)}function successChance(skill,dc){var need=dc-skillMod(skill);if(need<=2)return 95;if(need>=20)return 5;return clamp((21-need)*5,5,95)}function archetype(p){var s=p.skills,h=p.height;if(h>=215&&s.handle>=80&&s.three>=80&&s.block>=85)return'獨角獸';if(h>=205&&s.pass>=85&&s.vision>=86)return'全能組織長人';if(h>=198&&s.handle>=85&&s.pass>=82)return'控球前鋒';if(s.three>=85&&s.perdef>=84)return'3&D';return'尚未定型'}function phases(){return current&&current.level==='college'?['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']:['季前','2D20 特訓','自由配點','事件 1','事件 2','事件 3','事件 4','事件 5','賽季結算']}
function generatePlayer(){var p={id:idSeq++,name:E('name').value.trim()||'Player',pos:E('pos').value,height:+E('height').value,weight:+E('weight').value,wingspan:+E('wingspan').value,body:E('body').value,hand:E('hand').value,grade:1,skills:{}};var base=ri(44,61);Object.keys(names).forEach(k=>p.skills[k]=clamp(base+ri(-9,11),28,76));p.skills.touch+=Math.round((p.height-195)/6);p.skills.dunk+=Math.round((p.height-195)/3);p.skills.intdef+=Math.round((p.height-195)/3);p.skills.block+=Math.round((p.wingspan-p.height)/2.5);p.skills.dreb+=Math.round((p.wingspan-p.height)/3);p.skills.strength+=Math.round((p.weight-88)/5);Object.keys(p.skills).forEach(k=>p.skills[k]=clamp(p.skills[k],25,86));roster.push(p);renderRoster();startCareer(p.id)}function renderRoster(){E('players').innerHTML=roster.map((p,i)=>'<div class="player"><div class="playerhead"><div><div class="name">'+p.name+'</div><div class="small">#'+(i+1)+'｜'+p.pos+'｜'+p.height+'cm｜'+p.weight+'kg</div></div><div class="score">'+ovr(p)+'</div></div></div>').join('')||'<div class="small">尚未創建球員。</div>'}function startCareer(id){var p=roster.find(x=>x.id===id);current=JSON.parse(JSON.stringify(p));current.seed=E('seed').value.trim()||'DEFAULT';current.level='hbl';current.phase=0;current.pool=0;current.trust=50;current.scout=0;current.wins=0;current.log=[];current.eventOrder={};rng=mulberry32(hash(current.seed));E('setup').classList.add('hidden');E('career').classList.remove('hidden');prepareYear();addLog('🏁 開始 HBL 高一。');renderPhase()}function backHome(){E('career').classList.add('hidden');E('setup').classList.remove('hidden');renderRoster();scrollTo(0,0)}function prepareYear(){var arr=[0,1,2,3,4];for(var i=4;i>0;i--){var j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}current.eventOrder[(current.level==='college'?'c'+current.collegeYear:'h'+current.grade)]=arr}function addLog(t){current.log.unshift(t);E('log').innerHTML=current.log.map(x=>'<p>'+x+'</p>').join('')}function year(){if(current.level==='college')return'大'+['一','二','三','四'][current.collegeYear-1];return current.grade===1?'高一':current.grade===2?'高二':'高三'}function renderAll(){E('stage').textContent=current.level==='college'?current.college.short+' '+year():'HBL '+year();E('careerName').textContent=current.name;E('ovr').textContent=ovr(current);E('pool').textContent=current.pool;E('trust').textContent=current.trust;E('scout').textContent=current.scout;E('wins').textContent=current.wins;E('chips').innerHTML='<span class="chip">'+current.pos+'</span><span class="chip">'+current.height+'cm</span><span class="chip">'+archetype(current)+'</span>'+(current.level==='college'?'<span class="chip">'+current.college.country+'</span>':'');renderProgress();renderTabs();renderAttrs()}function renderProgress(){E('progress').innerHTML=phases().map((x,i)=>'<div class="step '+(i<current.phase?'done':i===current.phase?'active':'')+'">'+x+'</div>').join('')}function renderTabs(){E('attrTabs').innerHTML=Object.keys(groups).map(g=>'<button class="tab '+(g===activeGroup?'active':'')+'" onclick="activeGroup=\''+g+'\';renderTabs();renderAttrs()">'+g+'</button>').join('')}function renderAttrs(){if(!current)return;var can=current.phase===2;E('attributes').innerHTML=groups[activeGroup].map(k=>{var v=current.skills[k],c=cost(v);return'<div class="attr"><div class="attrTop"><span class="attrName">'+names[k]+'</span><span class="attrVal">'+v+'</span></div><div class="cost">升級 '+(c===999?'MAX':c+' 點')+'</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div>'+(can?'<button class="plus" '+(current.pool<c?'disabled':'')+' onclick="upgrade(\''+k+'\')">＋1</button>':'')+'</div>'}).join('')}function d20html(n){return'<div class="d20"><svg viewBox="0 0 100 100"><polygon points="50,3 92,28 82,78 50,97 18,78 8,28" fill="#b86b08" stroke="#ffd18a" stroke-width="2"/><polygon points="50,3 50,50 8,28" fill="#7f4705"/><polygon points="50,3 92,28 50,50" fill="#d18411"/><polygon points="8,28 50,50 18,78" fill="#a35d08"/><polygon points="92,28 82,78 50,50" fill="#915006"/><polygon points="18,78 50,50 50,97" fill="#c3730b"/><polygon points="82,78 50,97 50,50" fill="#6f3d04"/></svg><div class="num">'+n+'</div></div>'}function resetStory(){E('scoreboard').innerHTML='';E('diceArea').innerHTML='';E('choices').innerHTML='';E('offers').innerHTML='';E('offers').classList.add('hidden');E('result').className='result hidden';E('continueBtn').classList.add('hidden');E('continueBtn').textContent='繼續'}function ev(title,text,choices,score,clock){return{title,text,choices,score,clock}}function c(t,d,keys,dc,s,f){return{t,d,keys,dc,s,f}}
var hblIntros={1:['第一次穿上高中球衣','你首先要爭的不是明星位置，而是讓教練願意把你放上場。'],2:['你已經不是菜鳥了','高二，是從輪替球員變成真正主力最重要的一年。'],3:['最後一次穿上這件球衣','升學、球探、隊友期待，全都會在今年一起找上你。']};var genericHBL=[ev('正式比賽中的選擇','比賽進入僵持，你必須決定這個回合怎麼打。',[c('主動進攻','用持球與終結解決問題。',['handle','layup'],13,'你成功完成進攻。','出手被干擾。'),c('閱讀防守','先找最佳選擇。',['pass','vision'],12,'你找到空檔隊友。','傳球被預判。')]),ev('防守端被針對','對手開始刻意找你進攻。',[c('貼身防守','提高壓迫。',['perdef','defiq'],13,'你守住回合。','被一步過。'),c('保守站位','用判斷守空間。',['defiq','speed'],12,'你成功逼出勉強出手。','對方急停命中。')]),ev('球隊內部競爭','教練正在重新調整輪替。',[c('用得分搶位置','提高進攻侵略性。',['three','layup'],13,'你的表現被教練記住。','效率不佳。'),c('做髒活','防守、籃板、跑位都做。',['perdef','dreb','offball'],12,'你得到更多信任。','存在感不足。')]),ev('最後一攻','球隊落後兩分，最後 8.4 秒由你主導。',[c('切入挑戰2+1','攻擊禁區。',['layup','foulDraw','strength'],14,'你扛住碰撞得分。','上籃偏出。'),c('強拔三分','直接出手。',['three','handle'],16,'三分命中。','球彈框而出。'),c('突破分球','吸引協防。',['handle','pass','vision'],13,'隊友命中空檔。','傳球被抄。')],'68：70','8.4 秒'),ev('球季壓力','淘汰賽將近，壓力開始累積。',[c('加練','用訓練找手感。',['stamina','three','ft'],13,'你找到節奏。','疲勞累積。'),c('休息','優先恢復。',['offiq','stamina'],11,'你恢復得很好。','你仍然失眠。')])];
var collegeRoutes=[{id:'uba',country:'台灣',name:'UBA 一級一般校',short:'UBA',diff:0,ok:p=>ovr(p)>=48},{id:'ubaElite',country:'台灣',name:'UBA 一級強權',short:'UBA 強權',diff:1,ok:p=>ovr(p)>=62&&p.trust>=60},{id:'japan',country:'日本',name:'日本大學一級聯賽',short:'日本大學',diff:1,ok:p=>ovr(p)>=63&&p.scout>=15},{id:'korea',country:'韓國',name:'韓國大學聯賽',short:'韓國大學',diff:2,ok:p=>ovr(p)>=65&&p.scout>=20},{id:'philippines',country:'菲律賓',name:'菲律賓大學頂級聯賽',short:'菲律賓大學',diff:2,ok:p=>ovr(p)>=64&&p.scout>=22},{id:'d2',country:'美國',name:'NCAA Division II',short:'NCAA D2',diff:2,ok:p=>ovr(p)>=67&&p.scout>=28&&p.wins>=8},{id:'d1',country:'美國',name:'NCAA Division I',short:'NCAA D1',diff:3,ok:p=>ovr(p)>=73&&p.scout>=42&&p.wins>=10&&Math.max(...Object.values(p.skills))>=80}];
function routeFlavor(){var id=current.college.id;if(id==='d1')return{place:'美國校園',comp:'同梯四、五星高中生與國際新秀',big:'全國轉播與 March Madness 邊緣'};if(id==='d2')return{place:'美國小型大學城',comp:'成熟的大學球員',big:'分區錦標賽與轉學機會'};if(id==='japan')return{place:'日本大學球館',comp:'高紀律的學長與體系球員',big:'全日本大學錦標賽'};if(id==='korea')return{place:'韓國大學球館',comp:'身體對抗強硬的校隊球員',big:'大學聯賽淘汰階段'};if(id==='philippines')return{place:'球迷喧鬧的菲律賓大學球館',comp:'快速且敢打的後衛鋒線',big:'高人氣 rivalry 戰'};return{place:'台灣大專球館',comp:'各校 HBL 主力與成熟學長',big:'UBA 全國賽'} }
function collegeIntro(){var f=routeFlavor(),y=current.collegeYear;if(y===1)return{title:'你不再是高中明星',text:'你第一次走進 '+f.place+'。眼前的 '+f.comp+' 沒有人在意你高中時有多風光。\n\n大一的任務很單純：先進入輪替。'};if(y===2)return{title:'第二年，位置不再自動屬於你',text:'你已經熟悉環境，但新一屆天賦更好的學弟也進隊了。\n\n教練開始問：你只是合格輪替，還是真正主力？'};if(y===3)return{title:'大三，職業球探開始真正評估你',text:'你的名字開始出現在球探名單。'+f.big+' 也成了你證明身價的舞台。\n\n每一場關鍵比賽，都可能改變未來。'};return{title:'最後一年，你要留下什麼？',text:'大四。你已經是球隊最資深的一批人。\n\n冠軍、個人獎項、職業邀約——你剩下一個球季把履歷寫完。'}}
function collegeEventPool(){var d=current.college.diff||0,y=current.collegeYear,f=routeFlavor(),id=current.college.id;var arr=[];if(y===1){arr.push(ev('輪替從零開始','教練把你排在輪替邊緣，第一場熱身賽只給了你 7 分鐘。',[c('先靠防守站穩','從最不需要球權的工作做起。',['perdef','defiq','stamina'],11+d,'你守住主力球員，下一場時間增加。','一次漏人讓教練很快把你換下。'),c('上場就攻','用得分讓教練記住你。',['handle','layup','three'],13+d,'短短幾分鐘你連拿 7 分。','你過度急躁，連續兩次失誤。')]));arr.push(ev('第一次客場遠征','長途移動、陌生球館與完全不同的觀眾讓你第一次感受到大學賽季的長度。',[c('維持固定賽前習慣','用穩定節奏適應環境。',['stamina','offiq'],11+d,'你很快進入比賽狀態。','你整場都找不到節奏。'),c('提前加練熟悉場地','用更多準備換安心。',['three','ft','stamina'],12+d,'熱身手感延續到比賽。','你把體力消耗在賽前。')]));}
if(y===2){arr.push(ev('先發位置遭到挑戰','新來的大一球員天賦驚人，訓練中開始分走你的持球權。',[c('提高進攻層級','證明自己還是更成熟的持球點。',['handle','mid','offiq'],13+d,'你用成熟度拉開差距。','你太想壓過學弟，效率反而下降。'),c('變得更全面','用防守、傳球、籃板守住位置。',['perdef','pass','dreb'],12+d,'教練認為你更適合先發。','你的角色變得模糊。')]));arr.push(ev('教練要求你增加第二位置','球隊傷兵讓教練要求你嘗試不同位置。',[c('接受新角色','增加自己的戰術價值。',['offiq','handle','defiq'],12+d,'你成功擴張角色。','你在新位置上顯得不自然。'),c('堅持原位置','把強項做到最好。',['offiq','stamina'],11+d,'你維持高效率。','教練覺得你的彈性不足。')]));}
if(y===3){arr.push(ev('職業球探坐在場邊','助教告訴你，今天至少有三支職業球隊派人來看。',[c('展現完整技能包','主動持球、傳球、防守。',['handle','pass','perdef'],13+d,'球探報告寫下「全面」。','你為了展示太多反而失去效率。'),c('只打最強的武器','把比賽變成自己的招牌展示。',[bestSkillKey(current),'offiq'],12+d,'你的招牌能力成為焦點。','對手成功封鎖你的單一強項。')]));arr.push(ev('全國舞台的關鍵戰','你們只要贏下這場，就能進入 '+f.big+' 更深階段。',[c('接管最後五分鐘','把比賽扛到自己身上。',['handle','three','layup'],14+d,'你連續得分帶走比賽。','最後幾次出手都沒進。'),c('相信團隊執行','用傳球與防守贏球。',['pass','vision','defiq'],12+d,'你控制節奏完成勝利。','關鍵傳球出現失誤。')],'81：79','3:06'));}
if(y===4){arr.push(ev('職業隊給出模糊承諾','經紀顧問告訴你，有職業隊願意關注你，但沒有人保證選秀或合約。',[c('為職業試訓準備','開始針對體測與一對一強化。',['speed','stamina','handle'],13+d,'你的試訓評價上升。','過度調整打法影響校隊狀態。'),c('先把大學最後一年打完','把注意力放回球隊。',['offiq','defiq','stamina'],11+d,'你維持穩定表現。','曝光機會稍微減少。')]));arr.push(ev('大學生涯最後一場','終場前比分只差一球。這一次之後，你再也不會以大學生身份站上這塊球場。',[c('自己完成最後一攻','用自己的招牌收尾。',[bestSkillKey(current),'handle','offiq'],14+d,'你命中大學生涯最後一記關鍵球。','最後一球彈框而出。'),c('閱讀防守做正確選擇','不管誰出手，只求贏球。',['pass','vision','offiq'],12+d,'你找到完全空檔的隊友。','傳球角度被封死。')],'75：76','9.1 秒'));}
var special=id==='d1'?ev('全國轉播的第一次曝光','比賽被排進全國轉播，你第一次感受到每個失誤都會被放大的壓力。',[c('照常打','不因鏡頭改變。',['offiq','stamina'],12+d,'你穩定完成比賽。','你明顯受到壓力影響。'),c('主動搶鏡','把握曝光打出代表作。',['three','handle','layup'],14+d,'你成為賽後討論焦點。','你打得過於勉強。')]):id==='japan'?ev('學長要求你遵守隊內傳統','你第一次真正碰到嚴格的隊內階級與訓練規矩。',[c('先融入體系','用紀律換取信任。',['offiq','stamina'],11+d,'你很快融入隊伍。','你仍不習慣規矩。'),c('用場上表現說話','不改自己的球風。',['handle','offiq'],13+d,'實力讓學長開始尊重你。','你被認為太過自我。')]):id==='philippines'?ev('宿敵戰全場爆滿','從熱身開始，觀眾聲浪就幾乎蓋過教練聲音。',[c('享受氣氛主動攻擊','把情緒轉成侵略性。',['layup','three','stamina'],13+d,'你在喧鬧中打出代表作。','你被情緒帶著走。'),c('降速控制比賽','讓比賽回到自己的節奏。',['handle','pass','offiq'],12+d,'你成功冷卻對手氣勢。','節奏仍被主場氣氛拖走。')]):ev('聯賽中段的撞牆期','連續比賽讓你的身體開始感到沉重。',[c('加強恢復','犧牲額外訓練換體能。',['stamina','offiq'],11+d,'你很快恢復狀態。','恢復速度不如預期。'),c('硬撐訓練量','不想落後競爭者。',['stamina','strength'],13+d,'你撐過疲勞期。','疲勞繼續累積。')]);arr.push(special);while(arr.length<5)arr.push(ev('聯賽中的重要夜晚','一場勢均力敵的比賽進入第四節。',[c('主動得分','把球要到手上。',['handle','mid','three'],13+d,'你完成關鍵得分。','你錯失機會。'),c('讓比賽來找你','用防守和傳球影響結果。',['perdef','pass','offiq'],12+d,'你用正確選擇幫助球隊。','你沒有真正影響比賽。')]));return arr.slice(0,5)}function bestSkillKey(p){return Object.keys(p.skills).sort((a,b)=>p.skills[b]-p.skills[a])[0]}
function renderPhase(){resetStory();renderAll();if(current.level==='college'){renderCollegePhase();return}if(current.phase===0){var x=hblIntros[current.grade];E('eyebrow').textContent='SEASON OPENING';E('storyTitle').textContent=x[0];E('storyText').textContent=x[1];E('continueBtn').classList.remove('hidden')}else if(current.phase===1)trainingPhase();else if(current.phase===2)developmentPhase();else if(current.phase>=3&&current.phase<=7){showEvent(genericHBL[current.eventOrder['h'+current.grade][current.phase-3]],year()+' STORY '+(current.phase-2)+'/5')}else hblSummary()}
function trainingPhase(){var a=d20(),b=d20();current.pool+=a+b;E('eyebrow').textContent='PRESEASON TRAINING';E('storyTitle').textContent='季初特訓：2D20';E('storyText').textContent='兩顆 D20 決定本季可自由分配的訓練點。';E('diceArea').innerHTML='<div class="diceWrap">'+d20html(a)+d20html(b)+'<div><div class="small">本季訓練點</div><div class="ovr">'+(a+b)+'</div></div></div>';E('continueBtn').classList.remove('hidden');renderAll()}function developmentPhase(){E('eyebrow').textContent='PLAYER DEVELOPMENT';E('storyTitle').textContent='自由配點';E('storyText').textContent='把點數花在你想打造的能力上。';E('continueBtn').classList.remove('hidden');renderAttrs()}function upgrade(k){var c=cost(current.skills[k]);if(current.pool<c)return;current.pool-=c;current.skills[k]++;renderAll()}
function showEvent(e,label){current.event=e;E('eyebrow').textContent=label;E('storyTitle').textContent=e.title;if(e.score)E('scoreboard').innerHTML='<div class="scoreboard"><div class="board"><span class="small">比分</span><br><b>'+e.score+'</b></div><div class="board"><span class="small">時間</span><br><b class="clock">'+e.clock+'</b></div></div>';E('storyText').textContent=e.text;E('choices').innerHTML=e.choices.map((ch,i)=>{var skill=Math.round(avg(ch.keys.map(k=>current.skills[k]))),pct=successChance(skill,ch.dc);return'<button class="choice" onclick="resolveChoice('+i+')"><strong>'+ch.t+'</strong><span>'+ch.d+'</span><span class="test">考驗：'+ch.keys.map(k=>names[k]).join('＋')+'｜DC '+ch.dc+'</span><span class="chance">成功率 '+pct+'%</span><span class="reward">成功：訓練點 +2、信任 +4、'+names[ch.keys[0]]+' +1</span><span class="risk">失敗：信任 -2</span></button>'}).join('')}
function resolveChoice(i){var ch=current.event.choices[i],skill=Math.round(avg(ch.keys.map(k=>current.skills[k]))),mod=skillMod(skill),roll=d20(),ok=roll===20||(roll!==1&&roll+mod>=ch.dc);E('choices').innerHTML='';E('diceArea').innerHTML='<div class="diceWrap">'+d20html(roll)+'<div><div class="small">能力平均 '+skill+'｜修正 +'+mod+'</div><div style="font-size:27px;font-weight:900">最終 '+(roll+mod)+' vs DC '+ch.dc+'</div></div></div>';E('result').className='result '+(ok?'success':'fail');if(ok){current.pool+=2;current.trust=clamp(current.trust+4,0,100);current.scout=clamp(current.scout+(current.level==='college'?3:1),0,100);current.skills[ch.keys[0]]=clamp(current.skills[ch.keys[0]]+1,0,99);current.wins++;E('result').innerHTML='<b>✅ 成功</b><br>'+ch.s+'<br><br><b>獲得：</b> 訓練點 +2、信任 +4、'+names[ch.keys[0]]+' +1'}else{current.trust=clamp(current.trust-2,0,100);E('result').innerHTML='<b>❌ 失敗</b><br>'+ch.f+'<br><br><b>代價：</b> 信任 -2'}addLog((ok?'✅ ':'❌ ')+year()+'：'+current.event.title);renderAll();E('continueBtn').classList.remove('hidden')}
function hblSummary(){E('eyebrow').textContent='SEASON END';E('storyTitle').textContent=year()+'賽季結束';E('storyText').textContent='球季結束。OVR '+ovr(current)+'｜教練信任 '+current.trust+'｜球探關注 '+current.scout;E('continueBtn').textContent=current.grade<3?'進入下一學年':'查看大學邀約';E('continueBtn').classList.remove('hidden')}
function showCollegeOffers(){resetStory();current.level='offers';E('stage').textContent='升學選擇';E('progress').innerHTML='';E('eyebrow').textContent='RECRUITING';E('storyTitle').textContent='高中畢業後的邀約';E('storyText').textContent='只有達成條件的路線會出現。';var list=collegeRoutes.filter(r=>r.ok(current));E('offers').classList.remove('hidden');if(!list.length){E('offers').innerHTML='<button class="offer" onclick="chooseCollege(\'walkon\')"><div class="country">台灣</div><div class="offerName">大專校隊試訓</div><div class="meta">從板凳末端重新爭取。</div></button>';return}E('offers').innerHTML=list.map(r=>'<button class="offer" onclick="chooseCollege(\''+r.id+'\')"><div class="country">'+r.country+'</div><div class="offerName">'+r.name+'</div><div class="meta">正式邀約</div><span class="fit">可選</span></button>').join('')}
function chooseCollege(id){var r=id==='walkon'?{id:'walkon',country:'台灣',name:'大專校隊試訓',short:'大專試訓',diff:0}:collegeRoutes.find(x=>x.id===id);current.level='college';current.college=r;current.collegeYear=1;current.phase=0;current.trust=Math.max(40,Math.round(current.trust*.75));current.wins=0;prepareYear();addLog('🎓 加入 '+r.name+'。');renderPhase();scrollTo(0,0)}
function renderCollegePhase(){if(current.phase===0){var x=collegeIntro();E('eyebrow').textContent=current.college.short+'｜'+year();E('storyTitle').textContent=x.title;E('storyText').textContent=x.text;E('continueBtn').classList.remove('hidden')}else if(current.phase===1)trainingPhase();else if(current.phase===2)developmentPhase();else if(current.phase>=3&&current.phase<=7){var pool=collegeEventPool(),order=current.eventOrder['c'+current.collegeYear];showEvent(pool[order[current.phase-3]],current.college.short+' '+year()+' EVENT '+(current.phase-2)+'/5')}else collegeSummary()}
function collegeSummary(){E('eyebrow').textContent='COLLEGE SEASON END';E('storyTitle').textContent=current.college.short+' '+year()+'賽季結束';E('storyText').textContent='這一年結束了。\n\nOVR '+ovr(current)+'｜教練信任 '+current.trust+'｜球探關注 '+current.scout+'｜事件成功 '+current.wins;E('continueBtn').textContent=current.collegeYear<4?'進入大'+['二','三','四'][current.collegeYear-1]:'完成大學生涯';E('continueBtn').classList.remove('hidden')}
function advance(){if(current.level==='college'){if(current.phase<8){current.phase++;renderPhase();return}if(current.collegeYear<4){current.collegeYear++;current.phase=0;current.trust=Math.max(35,current.trust-5);prepareYear();addLog('📅 進入 '+current.college.short+' '+year()+'。');renderPhase()}else{resetStory();E('eyebrow').textContent='COLLEGE COMPLETE';E('storyTitle').textContent='大學生涯完成';E('storyText').textContent='四年的大學籃球正式結束。下一階段將接職業選秀、簽約與旅外。';E('progress').innerHTML=''}return}if(current.phase<8){current.phase++;renderPhase();return}if(current.grade<3){current.grade++;current.phase=0;prepareYear();renderPhase()}else showCollegeOffers()}
</script></body></html>
